"middle" fill="currentColor" style="font-size:11.5px;">B out of page, decreasing</text><text x="190.0" y="272.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">⇒ ℰ = −dΨ/dt > 0, counter-clockwise</text><line x1="298.0" y1="200.0" x2="298.0" y2="160.0" stroke="var(--hi)" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round"/><text x="306.0" y="184.0" text-anchor="start" fill="var(--hi)" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">I</text><line x1="230.0" y1="42.0" x2="150.0" y2="42.0" stroke="var(--hi)" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round"/><line x1="270.0" y1="60.0" x2="110.0" y2="220.0" stroke="var(--accent2)" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round"/><circle cx="190.0" cy="140.0" r="14.0" fill="var(--paper)" stroke="var(--accent2)" stroke-width="1.8"/><text x="190.0" y="145.0" text-anchor="middle" fill="var(--accent2)" style="font-size:13px;font-weight:700;">V</text><text x="360.0" y="60.0" text-anchor="start" fill="currentColor" style="font-size:13px;font-weight:600;">voltmeter from A to B reads</text><text x="360.0" y="92.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;">• along the R₁ side:   +I R₁</text><text x="360.0" y="118.0" text-anchor="start" fill="var(--accent)" style="font-size:12.5px;">• along the R₂ side:   −I R₂</text><text x="360.0" y="144.0" text-anchor="start" fill="var(--accent2)" style="font-size:12.5px;">• along the diagonal:  in between</text><text x="360.0" y="182.0" text-anchor="start" fill="currentColor" style="font-size:12px;">the two side readings differ by exactly</text><text x="360.0" y="202.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:600;">I R₁ + I R₂ = ℰ,  the emf of the loop</text><text x="360.0" y="238.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">a voltmeter reads ∫E·dl along its own leads;</text><text x="360.0" y="256.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">with dΨ/dt ≠ 0 that integral is path-dependent</text><text x="360.0" y="274.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">('voltage between A and B' is no longer defined)</text></svg><figcaption><strong>When 'the voltage between A and B' stops meaning anything.</strong> A changing flux drives a current I around the loop. Two ideal voltmeters connected to the same nodes A and B read different values — +IR₁ if the leads run beside R₁, −IR₂ if they run beside R₂ — and a third lead path reads something in between. None of them is wrong: each meter reports ∫<b>E</b>·d<b>l</b> along its own leads, and that integral is path-dependent because ∇×<b>E</b> = −∂<b>B</b>/∂t ≠ 0. The difference between two readings is the emf of the loop their leads form. This is the end of the path-independent voltage of Lecture 5; it returns only where the flux through the leads is negligible.</figcaption></figure>
