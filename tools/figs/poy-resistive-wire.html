end" fill="var(--muted)" style="font-size:10.5px;">1</text><line x1="466.0" y1="90.0" x2="602.0" y2="90.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/><text x="529.9" y="158.4" text-anchor="end" fill="var(--hi)" style="font-size:12.5px;font-weight:700;">(ρ/a)²</text><text x="540.0" y="300.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">= the heat made inside radius ρ:</text><text x="540.0" y="315.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">energy is absorbed as it flows in</text></svg><figcaption><strong>Where the heat in a resistor comes from.</strong> A straight wire of radius a and conductivity σ carries a steady current I to the right. Inside, <b>E</b> = <b>J</b>/σ points along the wire, and so does its tangential partner just outside the surface (tangential <b>E</b> is continuous). <b>H</b> circles the wire: out of the page above it (⊙), into the page below (⊗). Panel 1: on both sides <b>S</b> = <b>E</b> × <b>H</b> points <em>into</em> the wire, perpendicular to the current. Multiplying |<b>S</b>| by the side area gives exactly I²R. Panel 2, computed from S<sub>ρ</sub> = −E H<sub>φ</sub>(ρ) with H<sub>φ</sub> = Iρ/2πa²: the power that still crosses a cylinder of radius ρ falls as (ρ/a)², which is the heat generated inside that cylinder. The energy is delivered by the fields around the wire and absorbed on its way to the axis. It does not travel along the copper.</figcaption></figure>
