 Earth's. Every field line links the loop, so the circulation along each is the same μ₀I, and the longer outer lines must carry a weaker average field. The on-axis formula shows how much weaker: far away the field falls off as 1/r³, not 1/r² — the signature of a dipole. Two coaxial loops with parallel currents pull toward each other, which is how bar magnets attract: each is a stack of atomic current loops.</figcaption></figure>
