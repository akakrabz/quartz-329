e="var(--hi)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="80.0" y1="386.0" x2="258.2" y2="154.0" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round"/><line x1="119.1" y1="289.0" x2="289.1" y2="166.0" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><circle cx="198.8" cy="231.3" r="4.5" fill="var(--accent)" stroke="none" stroke-width="1.5"/><text x="207.8" y="248.3" text-anchor="start" fill="var(--accent)" style="font-size:12px;font-weight:700;">P</text><line x1="446.0" y1="58.0" x2="472.0" y2="58.0" stroke="currentColor" stroke-width="1.6" stroke-dasharray="7 5" stroke-linecap="round"/><text x="478.0" y="62.0" text-anchor="start" fill="currentColor" style="font-size:11px;">vacuum: ω = cβ</text><line x1="446.0" y1="82.0" x2="472.0" y2="82.0" stroke="var(--accent2)" stroke-width="2.4" stroke-linecap="round"/><text x="478.0" y="86.0" text-anchor="start" fill="currentColor" style="font-size:11px;">dielectric ε<tspan baseline-shift="sub" style="font-size:9px">r</tspan> = 4: ω = cβ/2</text><line x1="446.0" y1="106.0" x2="472.0" y2="106.0" stroke="var(--hi)" stroke-width="2.6" stroke-linecap="round"/><text x="478.0" y="110.0" text-anchor="start" fill="currentColor" style="font-size:11px;">plasma: ω<tspan baseline-shift="super" style="font-size:9px">2</tspan> = ω<tspan baseline-shift="sub" style="font-size:9px">p</tspan><tspan baseline-shift="super" style="font-size:9px">2</tspan> + c<tspan baseline-shift="super" style="font-size:9px">2</tspan>β<tspan baseline-shift="super" style="font-size:9px">2</tspan></text><line x1="446.0" y1="130.0" x2="472.0" y2="130.0" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round"/><text x="478.0" y="134.0" text-anchor="start" fill="currentColor" style="font-size:11px;">chord to P: slope v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = ω/β</text><line x1="446.0" y1="154.0" x2="472.0" y2="154.0" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><text x="478.0" y="158.0" text-anchor="start" fill="currentColor" style="font-size:11px;">tangent at P: slope v<tspan baseline-shift="sub" style="font-size:9px">g</tspan></text><text x="446.0" y="192.0" text-anchor="start" fill="currentColor" style="font-size:11px;font-weight:600;">At P, ω = 1.5ω<tspan baseline-shift="sub" style="font-size:9px">p</tspan>:</text><text x="446.0" y="210.0" text-anchor="start" fill="currentColor" style="font-size:11px;">v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = 1.34c (steeper than light)</text><text x="446.0" y="228.0" text-anchor="start" fill="currentColor" style="font-size:11px;">v<tspan baseline-shift="sub" style="font-size:9px">g</tspan> = dω/dβ = 0.75c</text><text x="446.0" y="246.0" text-anchor="start" fill="currentColor" style="font-size:11px;">v<tspan baseline-shift="sub" style="font-size:9px">p</tspan>v<tspan baseline-shift="sub" style="font-size:9px">g</tspan> = c<tspan baseline-shift="super" style="font-size:9px">2</tspan></text><text x="446.0" y="280.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">Lines through the origin are</text><text x="446.0" y="296.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">non-dispersive: v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = v<tspan baseline-shift="sub" style="font-size:9px">g</tspan> at every ω.</text><text x="446.0" y="318.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">Sound in a gas is one too, with</text><text x="446.0" y="334.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">slope about 10<tspan baseline-shift="super" style="font-size:9px">−6</tspan>c; at this scale</text><text x="446.0" y="350.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">it lies on the β axis.</text></svg><figcaption><strong>The notes' dispersion relations on one ω–β diagram</strong> (ω in units of the plasma frequency ω<sub>p</sub>, β in units of ω<sub>p</sub>/c). A TEM wave in vacuum or in a dielectric is a straight line through the origin, so ω/β is the same at every frequency: no dispersion, and pulses keep their shape. The collisionless plasma is the hyperbola ω² = ω<sub>p</sub>² + c²β². Below ω<sub>p</sub> (shaded) it has no real β, so no wave travels; above, it bends toward the light line. At any point the phase velocity ω/β is the slope of the chord from the origin, and for the plasma that chord is always steeper than the light line (v<sub>p</sub> &gt; c). The group velocity dω/dβ, the speed of a signal's envelope (Lecture 24), is the slope of the tangent, always less steep (v<sub>g</sub> &lt; c). At P, ω = 1.5ω<sub>p</sub>: v<sub>p</sub> = 1.34c and v<sub>g</sub> = 0.75c, with v<sub>p</sub>v<sub>g</sub> = c².</figcaption></figure>
