-muted)" style="font-size:10.5px;">open circuit: E = −v×B in the bar, I = 0</text></svg><figcaption><strong>Motional emf, and the circuit it is equivalent to.</strong> The carriers in the moving bar feel <b>v</b>×<b>B</b> along the bar, which pushes positive charge toward its upper end: the bar acts as a battery of emf vBℓ whose internal resistance is the bar's own R₁, driving the load R₂ through the perfectly conducting rails. The same number comes from the flux rule, because the loop's area grows at rate vℓ. In the lab the electric field is curl-free (<b>B</b> is constant, so ∇×<b>E</b> = −∂<b>B</b>/∂t = 0), so it is the <em>same</em> inside the bar and inside the load — Lecture 14's surprising result; what differs between them is that only the bar has the <b>v</b>×<b>B</b> term.</figcaption></figure>
