 ripple; only the travelling wave carries energy on average.</text></svg><figcaption><strong>Why the time average of a cosine squared is ½, and when an average hides a lot.</strong> Panel 1: cos²(ωt) equals ½ plus a ripple ½cos(2ωt). Over any whole period the ripple contributes nothing, because the area above ½ (blue) equals the area below it (green). So ⟨cos²(ωt + φ)⟩ = ½ for every phase φ, including φ = ∓βz. Panel 2 compares two Poynting vectors at the same point, z = λ/8. A single travelling wave (blue) pushes energy forward at every instant, in pulses at 2ω, with average E₀²/2η. Two equal waves travelling in opposite directions (a standing wave, red) give S = (E₀²/η) sin 2ωt sin 2βz. Here energy moves forward and back each cycle and the average is exactly zero at every z, even though the instantaneous S is not.</figcaption></figure>
