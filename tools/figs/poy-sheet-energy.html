style="font-size:11.5px;font-weight:600;">average η₀/2</text></svg><figcaption><strong>The notes' Example 1: J<sub>s</sub> = x̂ 2cos(ωt) A/m on z = 0 in vacuum.</strong> Panel 1 is a snapshot of the Poynting vector, computed from S<sub>z</sub> = ±η₀cos²(ωt ∓ βz). It is positive (pointing +z) on the right and negative (pointing −z) on the left, so energy flows away from the sheet on both sides and never back. Its humps are half a wavelength apart and travel outward at c. Each side averages η₀/2 ≈ 188 W/m² (the dashed lines). Panel 2 is a record at the sheet. The current gives up −<b>J</b><sub>s</sub>·<b>E</b> = 2η₀cos²ωt watts per square metre (red), and at every instant that is exactly the sum of what crosses the two faces, η₀cos²ωt each (blue). Both oscillate at 2ω, twice the source frequency. Averaged, η₀ goes in and η₀/2 leaves on each side.</figcaption></figure>
