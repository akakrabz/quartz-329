eight="13.0" rx="0" fill="var(--paper)" stroke="none" stroke-width="1.5" opacity="0.85"/><text x="490.4" y="508.0" text-anchor="end" fill="var(--hi)" style="font-size:10px;">1 GHz: δ = 1.3 cm, 100 dB at 15 cm</text></svg><figcaption><strong>Skin depths as numbers.</strong> Panel 1: in copper and aluminium δ = 1/√(πfμσ) holds at every radio and microwave frequency, and it is small. It is 8.5 mm (copper) and 11 mm (aluminium) at the 60 Hz of the power grid, 66 µm in copper at 1 MHz and 2.1 µm at 1 GHz. Halving δ takes four times the frequency. Panel 2: seawater, from the exact formula. Its δ follows the same √f law up to about 100 MHz, then levels off at 1.2 cm once seawater stops being a good conductor; the dotted line shows how wrong the good-conductor formula would be there. The dashed curve is the depth at which a signal has lost 100 dB, an illustrative receiver budget equal to 100/8.686 = 11.5 skin depths. It is about 330 m at the 76 Hz of the former US Navy ELF system and about 19 m at a 24 kHz VLF frequency, against 15 cm at 1 GHz.</figcaption></figure>
