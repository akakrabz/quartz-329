e" fill="var(--muted)" style="font-size:10.5px;">drawn for α/β = 0.6/2π ≈ 0.095 (τ ≈ 5.5°), so δ ≈ 1.67 λ; z ticks every λ</text><line x1="240.7" y1="153.0" x2="240.7" y2="159.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="236.7" y="171.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">λ</text><line x1="419.3" y1="153.0" x2="419.3" y2="159.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="415.3" y="171.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">2λ</text><line x1="598.0" y1="153.0" x2="598.0" y2="159.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="594.0" y="171.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">3λ</text></svg><figcaption><strong>A damped plane wave, frozen at two instants.</strong> Both curves are e<sup>−αz</sup>cos(ωt − βz), computed with α/β = 0.6/2π. The solid curve is t = 0. The dashed one is an eighth of a period later, and its zero crossings (the <em>nodes</em>) have moved λ/8 toward +z. Nodes are where the cosine is zero, so the envelope cannot move them, and they travel at v<sub>p</sub> = ω/β. Successive nodes are λ/2 apart, so λ = 2π/β spans two of them. The peaks follow the dotted envelope ±e<sup>−αz</sup>, which falls to 1/e at z = δ = 1/α. That is the penetration depth. Here α is small, so the wave survives about 1.7 wavelengths before it drops to 37 %. In a good conductor α = β and the same drop happens within λ/2π (Lecture 23). The notes' margin figure shows the same two snapshots without δ and λ marked.</figcaption></figure>
