ows the fields next to the sheet while J<sub>s</sub> &gt; 0 (current out of the page, ⊙): <b>H</b> = ½ẑ × x̂ = +½ŷ (up) on the right and down on the left; <b>E</b> into the page (⊗) on both sides; (−ẑ) × ŷ = +x̂, away from the sheet.</figcaption></figure>
