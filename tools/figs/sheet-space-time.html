wer any question, follow the world lines from the given line to the target line. (a) The horizontal line t = 1 s gives the same profile 100 m to the right. (b) The vertical line z = 0 gives a time record: A arrives at t = +1 s, but C, D and E crossed at t = −1, −3 and −4 s, so the record is the profile reversed. (c) The line z = 200 m gives the same record 2 s later. Parts (a) and (b) are worked in ink in the deck; (c) is left to the student and solved here.</figcaption></figure>
