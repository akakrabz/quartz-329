ine x1="122.5" y1="130.0" x2="82.0" y2="100.6" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="139.5" y1="117.7" x2="124.0" y2="70.1" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="160.5" y1="117.7" x2="176.0" y2="70.1" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="177.5" y1="130.0" x2="218.0" y2="100.6" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ahs)" stroke-linecap="round"/><text x="150.0" y="272.0" text-anchor="middle" fill="var(--accent)" style="font-size:12.5px;font-weight:600;">E = (ρₗ/2πεr) r̂</text><text x="150.0" y="292.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">𝓒 = 2πε / ln(b/a)   [F/m]</text><text x="150.0" y="36.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">+ρₗ on the core, −ρₗ on the shell</text><circle cx="470.0" cy="150.0" r="97.0" fill="currentColor" stroke="none" stroke-width="1.5" opacity="0.18"/><circle cx="470.0" cy="150.0" r="90.0" fill="var(--paper)" stroke="none" stroke-width="1.5"/><circle cx="470.0" cy="150.0" r="28.0" fill="currentColor" stroke="none" stroke-width="1.5" opacity="0.35"/><circle cx="470.0" cy="150.0" r="28.0" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="470.0" cy="150.0" r="90.0" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="470.0" cy="150.0" r="97.0" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="470.0" cy="150.0" r="42.0" fill="none" stroke="var(--accent2)" stroke-width="1.7"/><line x1="476.0" y1="108.0" x2="462.0" y2="108.0" stroke="var(--accent2)" stroke-width="1.7" marker-end="url(#ahs)" stroke-linecap="round"/><circle cx="470.0" cy="150.0" r="62.0" fill="none" stroke="var(--accent2)" stroke-width="1.7"/><line x1="476.0" y1="88.0" x2="462.0" y2="88.0" stroke="var(--accent2)" stroke-width="1.7" marker-end="url(#ahs)" stroke-linecap="round"/><circle cx="470.0" cy="150.0" r="74.0" fill="none" stroke="var(--accent2)" stroke-width="1.7"/><line x1="476.0" y1="76.0" x2="462.0" y2="76.0" stroke="var(--accent2)" stroke-width="1.7" marker-end="url(#ahs)" stroke-linecap="round"/><circle cx="470.0" cy="150.0" r="2.5" fill="currentColor" stroke="none" stroke-width="1.5"/><text x="470.0" y="272.0" text-anchor="middle" fill="var(--accent2)" style="font-size:12.5px;font-weight:600;">B = (μI/2πr) φ̂</text><text x="470.0" y="292.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">𝓛 = (μ/2π) ln(b/a)   [H/m]</text><text x="470.0" y="36.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">+I on the core (out of page), −I on the shell</text><text x="310.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:12px;">same</text><text x="310.0" y="146.0" text-anchor="middle" fill="var(--muted)" style="font-size:12px;">geometry</text><text x="310.0" y="168.0" text-anchor="middle" fill="currentColor" style="font-size:15px;font-weight:700;">𝓛𝓒 = με</text><text x="310.0" y="190.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">1/√(𝓛𝓒) = 1/√(με)</text><text x="310.0" y="206.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">= c in vacuum</text></svg><figcaption><strong>One cable, two circuit elements.</strong> Charge the conductors and the radial <b>E</b> between them stores energy: capacitance per metre 𝓒 = 2πε/ln(b/a). Send a current down the core and back on the shell and the azimuthal <b>B</b> between them stores energy: inductance per metre 𝓛 = (μ/2π) ln(b/a). The logarithm appears in the numerator of one and the denominator of the other, so 𝓛𝓒 = με independent of the radii — and 1/√(𝓛𝓒) is the speed of light in the filling. That is not a coincidence of the coax; it holds for every two-conductor line, and it is why signals on cables travel at (nearly) the speed of light.</figcaption></figure>
