<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><path d="M95,160 A120,95 0 0 0 335,160" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M95,160 A120,105 0 0 1 335,160" fill="var(--accent2)" fill-opacity="0.10" stroke="var(--accent2)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="215" cy="160" rx="120" ry="34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 4"/><line x1="245.0" y1="194.0" x2="285.0" y2="190.0" stroke="currentColor" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round"/><text x="291.0" y="204.0" text-anchor="start" fill="currentColor" style="font-size:12px;">C (radius a)</text><circle cx="215.0" cy="160.0" r="11.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><line x1="210.0" y1="160.0" x2="220.0" y2="160.0" stroke="white" stroke-width="2.2" stroke-linecap="round"/><line x1="215.0" y1="155.0" x2="215.0" y2="165.0" stroke="white" stroke-width="2.2" stroke-linecap="round"/><text x="231.0" y="166.0" text-anchor="start" fill="currentColor" style="font-size:13px;font-weight:600;">Q(t)</text><line x1="215.0" y1="149.0" x2="215.0" y2="36.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="229.0" y1="112.0" x2="229.0" y2="62.0" stroke="var(--hi)" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/><text x="237.0" y="90.0" text-anchor="start" fill="var(--hi)" style="font-size:12.5px;font-weight:600;">I = −dQ/dt</text><line x1="198.8" y1="149.6" x2="169.3" y2="130.7" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><line x1="231.8" y1="150.1" x2="262.4" y2="132.0" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><line x1="197.4" y1="169.2" x2="165.3" y2="186.0" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><line x1="233.2" y1="168.7" x2="266.2" y2="184.5" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><line x1="223.0" y1="145.6" x2="237.5" y2="119.5" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><line x1="207.9" y1="145.4" x2="195.0" y2="118.9" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ahs)" opacity="0.9" stroke-linecap="round"/><text x="155.0" y="48.0" text-anchor="end" fill="var(--accent2)" style="font-size:12px;font-weight:600;">S₁: dome above</text><text x="8.0" y="260.0" text-anchor="start" fill="var(--accent)" style="font-size:12px;font-weight:600;">S₂: bowl below</text><text x="215.0" y="292.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">D-flux of Q: Q/2 up through the dome, Q/2 down through the bowl</text><text x="395.0" y="52.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:600;">∮H·dl = ∫(J + ∂D/∂t)·dS,  any S on C</text><text x="395.0" y="84.0" text-anchor="start" fill="var(--accent2)" style="font-size:12px;font-weight:600;">dome S₁: pierced by the wire</text><text x="395.0" y="102.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">J-term = +I;  D-flux = +Q/2</text><text x="395.0" y="118.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">⇒  I + d(Q/2)/dt = I − I/2 = I/2</text><text x="395.0" y="150.0" text-anchor="start" fill="var(--accent)" style="font-size:12px;font-weight:600;">bowl S₂: no wire through it</text><text x="395.0" y="168.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">J-term = 0;  D-flux = −Q/2 (oriented by C)</text><text x="395.0" y="184.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">⇒  0 + d(−Q/2)/dt = +I/2</text><line x1="395.0" y1="200.0" x2="620.0" y2="200.0" stroke="var(--muted)" stroke-width="1" stroke-linecap="round"/><text x="395.0" y="222.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-weight:600;">both surfaces give I/2</text><text x="395.0" y="246.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">without ∂D/∂t they give I and 0:</text><text x="395.0" y="262.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">Ampère alone breaks charge conservation</text></svg><figcaption><strong>Why Ampère's law needs a second term.</strong> A point charge drains away through a wire. Take the circle C around the wire, in the plane of the charge, and ask for ∮<b>H</b>·d<b>l</b>. Stokes' theorem lets you evaluate the right-hand side on <em>any</em> surface spanning C: a dome above is pierced by the wire, a bowl below is not. With only ∫<b>J</b>·d<b>S</b> on the right the two surfaces give I and 0 — nonsense, since the left side does not know which surface you picked. Add the displacement current ∫∂<b>D</b>/∂t·d<b>S</b>: by Gauss's law half of Q's flux threads each surface, and its rate of change (dQ/dt = −I) restores agreement at I/2 — which is also what Biot–Savart gives for a semi-infinite wire. The classic charging capacitor is the same story with the plates playing the part of Q(t).</figcaption></figure>
