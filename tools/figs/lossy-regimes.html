0.01</text><line x1="222.0" y1="497.0" x2="222.0" y2="503.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="222.0" y="516.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">0.1</text><line x1="348.0" y1="497.0" x2="348.0" y2="503.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="348.0" y="516.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">1</text><line x1="474.0" y1="497.0" x2="474.0" y2="503.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="474.0" y="516.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">10</text><line x1="600.0" y1="497.0" x2="600.0" y2="503.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="600.0" y="516.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">100</text><text x="348.0" y="534.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">x = ωε/σ  (log scale; x = 1 at f = σ/2πε)</text></svg><figcaption><strong>How one material changes character with frequency.</strong> All curves come from the exact formulas, plotted against x = ωε/σ, the inverse of the ratio s = σ/ωε. Top: the penetration depth δ = 1/α (solid) and λ/2π = 1/β (dashed), in units of the high-frequency depth δ<sub>∞</sub> = (2/σ)√(ε/μ). On the left the medium is a good conductor. There the two lengths nearly coincide and grow as 1/√ω toward low frequency (dotted asymptote), which is the notes' reason for using low frequencies in sea water. On the right it is an imperfect dielectric: δ levels off at δ<sub>∞</sub>, while λ keeps shrinking as 1/ω, so the wave travels many wavelengths before it fades. Middle and bottom: |η| climbs from √(ωμ/σ) to √(μ/ε), and its angle τ falls from 45° to 0. Near x = 1 neither shortcut holds; there τ = 22.5° and δ = 1.10 δ<sub>∞</sub>. The page's table lists the same values.</figcaption></figure>
