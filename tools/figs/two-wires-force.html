"232.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">antiparallel currents repel</text><text x="320.0" y="24.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">dF = I dl × B,   with B of the other wire = μ₀I/(2πr) φ̂</text></svg><figcaption><strong>Ampère's 1820 observation, in field language.</strong> Wire 1 makes a field <b>B</b>₁ that circulates around it (into the page below the wire, for a current to the right). Wire 2 sits in that field and each of its current elements feels d<b>F</b> = I₂ d<b>l</b> × <b>B</b>₁: toward wire 1 when the currents run the same way, away when they are opposed. The force on wire 1 is the mirror image. There is no electric field anywhere in the lab — both wires are neutral — yet the moving carriers feel a force. Lecture 12 explains where it comes from: in the carriers' own frame the other wire is <em>not</em> neutral.</figcaption></figure>
