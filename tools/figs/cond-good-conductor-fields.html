6,333.4 L600.0,333.9" fill="none" stroke="var(--accent2)" stroke-width="2.4" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="70.0" y1="297.2" x2="149.9" y2="297.2" stroke="currentColor" stroke-width="0.9" stroke-dasharray="3 3" stroke-linecap="round"/><text x="64.0" y="301.2" text-anchor="end" fill="currentColor" style="font-size:10.5px;">1/e</text><circle cx="110.0" cy="297.2" r="3.6" fill="var(--hi)" stroke="none" stroke-width="1.5"/><circle cx="149.9" cy="297.2" r="3.6" fill="currentColor" stroke="none" stroke-width="1.5"/><text x="273.7" y="236.0" text-anchor="start" fill="var(--accent)" style="font-size:10.5px;font-weight:600;">blue: E/E₀ = e<tspan baseline-shift="super" style="font-size:9px">−z/δ</tspan> cos(z/δ)</text><text x="273.7" y="253.0" text-anchor="start" fill="var(--accent2)" style="font-size:10.5px;font-weight:600;">green, dashed: H/H₀ = e<tspan baseline-shift="super" style="font-size:9px">−z/δ</tspan> cos(z/δ + π/4)</text><text x="273.7" y="270.0" text-anchor="start" fill="var(--muted)" style="font-size:10.5px;font-weight:600;">grey, dashed: the envelope ±e<tspan baseline-shift="super" style="font-size:9px">−z/δ</tspan></text><text x="273.7" y="287.0" text-anchor="start" fill="var(--hi)" style="font-size:10.5px;font-weight:600;">red, dotted: the power, ∝ e<tspan baseline-shift="super" style="font-size:9px">−2z/δ</tspan></text><text x="273.7" y="304.0" text-anchor="start" fill="currentColor" style="font-size:10.5px;">dots: power down to 1/e at δ/2, the field at δ</text><text x="320.0" y="506.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">E = x̂ E₀ e<tspan baseline-shift="super" style="font-size:9px">−z/δ</tspan> cos(ωt − z/δ),   H = ŷ H₀ e<tspan baseline-shift="super" style="font-size:9px">−z/δ</tspan> cos(ωt − z/δ − π/4),   H₀ = E₀/|η| = σδE₀/√2</text><text x="320.0" y="526.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">each field is drawn relative to its own amplitude; H₀ is far larger than E₀/η₀ would be in air</text></svg><figcaption><strong>A plane wave inside a good conductor, travelling along +z.</strong> Panel 1 is the record at the surface: because η = (1 + j)/(σδ) has a phase of 45°, H reaches each maximum one-eighth of a period after E. Panel 2 is a snapshot against depth, in units of δ = 1/√(πfμσ). Since α = β = 1/δ, the decay and the phase advance happen on the same length scale. The field envelope falls to 1/e at one skin depth; the power, which goes as the square, is already down to 1/e at δ/2 and to e<sup>−2</sup> = 14 % at δ. After one wavelength λ = 2πδ the field is down to e<sup>−2π</sup> ≈ 1/535 (−54.6 dB), and after two wavelengths to −109 dB: in a good conductor a wave is effectively gone within a wavelength or two. The icon checks the direction: with x up, z to the right and y out of the page, E (up) × H (out, ⊙) points right, into the conductor.</figcaption></figure>
