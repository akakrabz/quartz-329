r(--accent2)" style="font-size:12px;font-weight:600;">I/(2πr)</text><text x="551.0" y="218.0" text-anchor="start" fill="var(--muted)" style="font-size:13px;font-weight:600;">0</text><text x="485.0" y="278.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">H·2πr = I<tspan baseline-shift="sub" style="font-size:9px">enc</tspan>(r)</text></svg><figcaption><strong>Ampère's law is Gauss's law with a loop.</strong> For a coax with a uniform current I in the core and −I on the shell, symmetry says <b>H</b> = H<sub>φ</sub>(r) φ̂, so the circulation around a circle is simply H<sub>φ</sub>·2πr, and the law hands you the field once you count the enclosed current: a fraction r²/a² of I inside the core, all of I between the conductors, and zero outside (I − I). Compare the Gauss-law profile of a charged cylinder in Lecture 3 — same reasoning, with 'charge inside' replaced by 'current through'. The only region where H<sub>φ</sub> is constant is outside, where it is zero (the Lecture 12 challenge question).</figcaption></figure>
