ext x="400.0" y="146.0" text-anchor="start" fill="var(--hi)" style="font-size:11.5px;">H<tspan baseline-shift="sub" style="font-size:9px">c</tspan>, coercivity: the reverse H</text><text x="400.0" y="162.0" text-anchor="start" fill="var(--hi)" style="font-size:11.5px;">needed to bring B back to zero</text><text x="400.0" y="186.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">B depends on H and on the history:</text><text x="400.0" y="202.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">μ = B/H is not a material constant</text><text x="400.0" y="226.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">loop area = energy lost per m³</text><text x="400.0" y="242.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">per cycle (heats transformer cores)</text><text x="400.0" y="268.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">soft magnets: narrow loop, small H<tspan baseline-shift="sub" style="font-size:9px">c</tspan></text><text x="400.0" y="284.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">hard magnets: wide loop, large B<tspan baseline-shift="sub" style="font-size:9px">r</tspan>, H<tspan baseline-shift="sub" style="font-size:9px">c</tspan></text></svg><figcaption><strong>A ferromagnet remembers.</strong> Start with an unmagnetized sample (domains pointing every which way, M = 0) and raise H: B climbs along the dashed virgin curve as favourably oriented domains grow and the others turn, until nearly every moment is aligned and B saturates. Now lower H. B does not retrace its path: at H = 0 there is still a remanent flux density B<sub>r</sub> — the sample has become a permanent magnet — and a reverse field −H<sub>c</sub> (the coercivity) is needed to bring B to zero. Driving H back and forth traces the loop counter-clockwise; its area is the energy per unit volume turned into heat each cycle. Because B depends on the history, μ = B/H is not a constant for these materials; the vacuum line B = μ₀H is almost flat on this scale, which is what χ<sub>m</sub> ≫ 1 means. The shape is schematic.</figcaption></figure>
