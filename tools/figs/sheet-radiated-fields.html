14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">E</text><text x="264.0" y="176.0" text-anchor="end" fill="var(--accent)" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">E</text><circle cx="420.0" cy="140.0" r="8.0" fill="none" stroke="var(--accent2)" stroke-width="1.4"/><line x1="415.0" y1="135.0" x2="425.0" y2="145.0" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><line x1="415.0" y1="145.0" x2="425.0" y2="135.0" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><circle cx="220.0" cy="140.0" r="8.0" fill="none" stroke="var(--accent2)" stroke-width="1.4"/><circle cx="220.0" cy="140.0" r="1.8" fill="var(--accent2)" stroke="none" stroke-width="1.5"/><text x="420.0" y="124.0" text-anchor="middle" fill="var(--accent2)" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">H</text><text x="220.0" y="124.0" text-anchor="middle" fill="var(--accent2)" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">H</text><line x1="448.0" y1="140.0" x2="520.0" y2="140.0" stroke="currentColor" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><line x1="192.0" y1="140.0" x2="120.0" y2="140.0" stroke="currentColor" stroke-width="3" marker-end="url(#ah)" stroke-linecap="round"/><text x="484.0" y="130.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">E × H</text><text x="156.0" y="130.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">E × H</text><text x="480.0" y="70.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">z &gt; 0  (forward wave)</text><text x="480.0" y="88.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">E = −x̂ (η/2) J<tspan baseline-shift="sub" style="font-size:9px">x</tspan>(t − z/v)</text><text x="480.0" y="106.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">H = −ŷ ½ J<tspan baseline-shift="sub" style="font-size:9px">x</tspan>(t − z/v)</text><text x="160.0" y="70.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">z &lt; 0  (backward wave)</text><text x="160.0" y="88.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">E = −x̂ (η/2) J<tspan baseline-shift="sub" style="font-size:9px">x</tspan>(t + z/v)</text><text x="160.0" y="106.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">H = +ŷ ½ J<tspan baseline-shift="sub" style="font-size:9px">x</tspan>(t + z/v)</text><text x="320.0" y="274.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">at z = 0:  E continuous (the same on both faces);   ẑ × (H⁺ − H⁻) = J<tspan baseline-shift="sub" style="font-size:9px">s</tspan></text><text x="320.0" y="294.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">E opposes J<tspan baseline-shift="sub" style="font-size:9px">s</tspan>  ⇒  J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> · E &lt; 0: the sheet gives energy to the two waves</text><line x1="34.0" y1="312.0" x2="34.0" y2="278.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ahs)" stroke-linecap="round"/><text x="41.0" y="284.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">x</text><line x1="34.0" y1="312.0" x2="68.0" y2="312.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ahs)" stroke-linecap="round"/><text x="72.0" y="316.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><circle cx="34.0" cy="312.0" r="5.0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="34.0" cy="312.0" r="1.8" fill="currentColor" stroke="none" stroke-width="1.5"/><text x="26.0" y="316.0" text-anchor="end" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">y</text></svg><figcaption><strong>What a time-varying current sheet radiates, at one instant while J<sub>x</sub> &gt; 0.</strong> The page is the xz-plane (x up, z right, y out of the page). Next to the sheet, <b>E</b> points down on <em>both</em> sides, opposite to the current, with size (η/2)J<sub>x</sub>. <b>H</b> has the Lecture 13 static pattern, ½<b>J</b><sub>s</sub> × n̂: into the page (⊗) on the right, out of it (⊙) on the left. Check each side with a cross product: (−x̂) × (−ŷ) = +ẑ on the right and (−x̂) × (+ŷ) = −ẑ on the left, so <b>E</b> × <b>H</b> points away from the sheet on both faces. That is the direction each wave travels. Farther out, the fields are the same but delayed by |z|/v. The two jump conditions of Lecture 16 hold at z = 0: tangential <b>E</b> is continuous and tangential <b>H</b> jumps by J<sub>s</sub>.</figcaption></figure>
