" stroke-linecap="round"/><line x1="495.0" y1="132.0" x2="495.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="519.0" y1="132.0" x2="519.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><path d="M477,88 A22,10 0 0 1 513,88" fill="none" stroke="var(--hi)" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round" stroke-linecap="round"/><text x="495.0" y="76.0" text-anchor="middle" fill="var(--hi)" style="font-size:9.5px;">rotate / stretch</text><text x="495.0" y="155.0" text-anchor="middle" fill="currentColor" style="font-size:10px;">uniform B,</text><text x="495.0" y="168.0" text-anchor="middle" fill="currentColor" style="font-size:10px;">C moves</text><rect x="550.0" y="60.0" width="80.0" height="80.0" rx="6" fill="none" stroke="var(--muted)" stroke-width="1"/><ellipse cx="590" cy="110" rx="26" ry="11" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="564.0" y1="132.0" x2="564.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="580.0" y1="132.0" x2="580.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="592.0" y1="132.0" x2="592.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="602.0" y1="132.0" x2="602.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="610.0" y1="132.0" x2="610.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="616.0" y1="132.0" x2="616.0" y2="82.0" stroke="var(--accent)" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/><line x1="600.0" y1="110.0" x2="624.0" y2="110.0" stroke="var(--hi)" stroke-width="1.8" marker-end="url(#ahs)" stroke-linecap="round"/><text x="590.0" y="76.0" text-anchor="middle" fill="var(--hi)" style="font-size:10px;">v in B(r)</text><text x="590.0" y="155.0" text-anchor="middle" fill="currentColor" style="font-size:10px;">C moves in</text><text x="590.0" y="168.0" text-anchor="middle" fill="currentColor" style="font-size:10px;">nonuniform B</text><text x="490.0" y="200.0" text-anchor="middle" fill="var(--accent)" style="font-size:11.5px;">the first is 'transformer' emf: ∮E·dl ≠ 0</text><text x="490.0" y="218.0" text-anchor="middle" fill="var(--hi)" style="font-size:11.5px;">the other two are motional: ∮(v×B)·dl</text><text x="490.0" y="246.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;font-weight:600;">same −dΨ/dt either way</text></svg><figcaption><strong>The flux rule.</strong> Orient the loop C, let the right-hand rule fix d<b>S</b>, and compute the flux Ψ = ∫<b>B</b>·d<b>S</b> through <em>any</em> surface spanning C (they all agree, because ∇·<b>B</b> = 0). The emf — the work per unit charge done by <b>E</b> + <b>v</b>×<b>B</b> once around C — equals −dΨ/dt. The minus sign is Lenz's rule: here the upward flux is growing, so the induced current circulates the other way and makes a downward field inside the loop, resisting the change. Whether the flux changes because <b>B</b> varies in time, because the loop moves or deforms, or because it slides through a nonuniform field, the rule is the same; what differs is how much of the emf is ∮<b>E</b>·d<b>l</b> and how much is ∮(<b>v</b>×<b>B</b>)·d<b>l</b>.</figcaption></figure>
