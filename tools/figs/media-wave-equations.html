<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20.0" y="24.0" text-anchor="start" fill="currentColor" style="font-size:18px;font-weight:700;">One equation, many media</text><text x="20.0" y="43.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">Every wave equation of Lectures 18–30 is the same equation with one term kept, dropped or renamed.</text><rect x="150.0" y="56.0" width="460.0" height="58.0" rx="7" fill="currentColor" fill-opacity="0.05" stroke="none"/><rect x="150.0" y="56.0" width="460.0" height="58.0" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="380.0" y="76.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;font-weight:700;">Maxwell's curl equations — source-free, homogeneous, linear</text><text x="380.0" y="97.0" text-anchor="middle" fill="currentColor" style="font-size:13.5px;">∇×E = −μ ∂H/∂t&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;∇×H = σE + ε ∂E/∂t</text><line x1="380.0" y1="114.0" x2="380.0" y2="140.0" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah)" stroke-linecap="round"/><text x="392.0" y="132.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">curl of Faraday, ∇·E = 0</text><rect x="110.0" y="142.0" width="540.0" height="88.0" rx="8" fill="var(--accent)" fill-opacity="0.1" stroke="none"/><rect x="110.0" y="142.0" width="540.0" height="88.0" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.8"/><text x="380.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:13px;font-weight:700;">The general wave equation (time domain)</text><text x="278.0" y="194.0" text-anchor="end" fill="currentColor" style="font-size:17px;">∇²E =</text><text x="330.0" y="194.0" text-anchor="middle" fill="currentColor" style="font-size:17px;">μσ ∂E/∂t</text><text x="398.0" y="194.0" text-anchor="middle" fill="currentColor" style="font-size:17px;">+</text><text x="470.0" y="194.0" text-anchor="middle" fill="currentColor" style="font-size:17px;">με ∂²E/∂t²</text><text x="330.0" y="216.0" text-anchor="middle" fill="var(--hi)" style="font-size:11px;font-weight:600;">conduction: loss</text><text x="470.0" y="216.0" text-anchor="middle" fill="var(--accent2)" style="font-size:11px;font-weight:600;">displacement: waves</text><line x1="240.0" y1="230.0" x2="128.0" y2="276.0" stroke="var(--accent2)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="380.0" y1="230.0" x2="380.0" y2="276.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="520.0" y1="230.0" x2="632.0" y2="276.0" stroke="var(--hi)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><rect x="117.3" y="242.0" width="35.7" height="14.0" rx="0" fill="var(--paper)" stroke="none" stroke-width="1.5" opacity="0.85"/><text x="150.0" y="252.0" text-anchor="end" fill="var(--accent2)" style="font-size:11px;font-weight:600;">σ = 0</text><rect x="385.0" y="246.0" width="148.6" height="14.0" rx="0" fill="var(--paper)" stroke="none" stroke-width="1.5" opacity="0.85"/><text x="388.0" y="256.0" text-anchor="start" fill="var(--accent)" style="font-size:11px;font-weight:600;">one frequency: ∂/∂t → jω</text><rect x="609.0" y="242.0" width="41.6" height="14.0" rx="0" fill="var(--paper)" stroke="none" stroke-width="1.5" opacity="0.85"/><text x="612.0" y="252.0" text-anchor="start" fill="var(--hi)" style="font-size:11px;font-weight:600;">σ ≫ ωε</text><rect x="14.0" y="278.0" width="228.0" height="128.0" rx="7" fill="var(--accent2)" fill-opacity="0.09" stroke="none"/><rect x="14.0" y="278.0" width="228.0" height="128.0" rx="7" fill="none" stroke="var(--accent2)" stroke-width="1.5"/><text x="128.0" y="296.0" text-anchor="middle" fill="var(--accent2)" style="font-size:13px;font-weight:700;">Lossless wave equation</text><text x="128.0" y="313.0" text-anchor="middle" fill="currentColor" style="font-size:13px;">∇²E = με ∂²E/∂t²</text><text x="128.0" y="329.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">E = f(t ∓ z/v),  v = 1/√(με)</text><text x="128.0" y="345.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">any pulse keeps its shape</text><text x="128.0" y="361.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">η = √(μ/ε) real: E, H in step</text><text x="128.0" y="377.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Lectures 18–19</text><rect x="266.0" y="278.0" width="228.0" height="128.0" rx="7" fill="var(--accent)" fill-opacity="0.09" stroke="none"/><rect x="266.0" y="278.0" width="228.0" height="128.0" rx="7" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="380.0" y="296.0" text-anchor="middle" fill="var(--accent)" style="font-size:13px;font-weight:700;">Helmholtz equation (phasor)</text><text x="380.0" y="313.0" text-anchor="middle" fill="currentColor" style="font-size:13px;">∇²Ẽ = γ²Ẽ</text><text x="380.0" y="329.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">γ² = jωμ(σ + jωε)</text><text x="380.0" y="345.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">Ẽ = E₀ e^(∓γz),  γ = α + jβ</text><text x="380.0" y="361.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">covers every case below</text><text x="380.0" y="377.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Lectures 21–22</text><rect x="518.0" y="278.0" width="228.0" height="128.0" rx="7" fill="var(--hi)" fill-opacity="0.09" stroke="none"/><rect x="518.0" y="278.0" width="228.0" height="128.0" rx="7" fill="none" stroke="var(--hi)" stroke-width="1.5"/><text x="632.0" y="296.0" text-anchor="middle" fill="var(--hi)" style="font-size:13px;font-weight:700;">Diffusion equation</text><text x="632.0" y="313.0" text-anchor="middle" fill="currentColor" style="font-size:13px;">∇²E = μσ ∂E/∂t</text><text x="632.0" y="329.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">the heat equation: fields soak in</text><text x="632.0" y="345.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">pulses smear, no fixed speed</text><text x="632.0" y="361.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">phasor form: γ² = jωμσ</text><text x="632.0" y="377.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">good conductor (EM GeoSci: quasi-static)</text><line x1="380.0" y1="406.0" x2="380.0" y2="426.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="380.0" y="444.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:700;">γ² in each medium the course meets</text><rect x="14.0" y="452.0" width="142.0" height="126.0" rx="7" fill="var(--accent2)" fill-opacity="0.09" stroke="none"/><rect x="14.0" y="452.0" width="142.0" height="126.0" rx="7" fill="none" stroke="var(--accent2)" stroke-width="1.5"/><text x="85.0" y="470.0" text-anchor="middle" fill="var(--accent2)" style="font-size:12px;font-weight:700;">perfect dielectric</text><text x="85.0" y="488.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ² = −ω²με</text><text x="85.0" y="505.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ = jβ,&#160;&#160;β = ω√(με)</text><text x="85.0" y="522.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">travels, no decay</text><text x="85.0" y="539.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">τ = 0</text><text x="85.0" y="556.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L18–21</text><rect x="164.0" y="452.0" width="142.0" height="126.0" rx="7" fill="var(--accent)" fill-opacity="0.09" stroke="none"/><rect x="164.0" y="452.0" width="142.0" height="126.0" rx="7" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="235.0" y="470.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">lossy medium</text><text x="235.0" y="488.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ² = jωμσ − ω²με</text><text x="235.0" y="505.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ = α + jβ</text><text x="235.0" y="522.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">travels and decays</text><text x="235.0" y="539.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">H lags E by τ = ∠η</text><text x="235.0" y="556.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L22–23</text><rect x="314.0" y="452.0" width="142.0" height="126.0" rx="7" fill="var(--hi)" fill-opacity="0.09" stroke="none"/><rect x="314.0" y="452.0" width="142.0" height="126.0" rx="7" fill="none" stroke="var(--hi)" stroke-width="1.5"/><text x="385.0" y="470.0" text-anchor="middle" fill="var(--hi)" style="font-size:12px;font-weight:700;">good conductor</text><text x="385.0" y="488.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ² ≈ jωμσ</text><text x="385.0" y="505.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ = (1 + j)/δ</text><text x="385.0" y="522.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">gone within one λ</text><text x="385.0" y="539.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">τ = 45°</text><text x="385.0" y="556.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L23</text><rect x="464.0" y="452.0" width="142.0" height="126.0" rx="7" fill="var(--accent)" fill-opacity="0.09" stroke="none"/><rect x="464.0" y="452.0" width="142.0" height="126.0" rx="7" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="535.0" y="470.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">plasma (no collisions)</text><text x="535.0" y="488.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">σ = −jNq²/(mω)</text><text x="535.0" y="505.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ² = (ω<tspan baseline-shift="sub" style="font-size:9px">p</tspan>² − ω²)/c²</text><text x="535.0" y="522.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">ω > ω<tspan baseline-shift="sub" style="font-size:9px">p</tspan>: travels, v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> > c</text><text x="535.0" y="539.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">ω < ω<tspan baseline-shift="sub" style="font-size:9px">p</tspan>: evanescent</text><text x="535.0" y="556.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L21, L24</text><rect x="614.0" y="452.0" width="142.0" height="126.0" rx="7" fill="var(--accent2)" fill-opacity="0.09" stroke="none"/><rect x="614.0" y="452.0" width="142.0" height="126.0" rx="7" fill="none" stroke="var(--accent2)" stroke-width="1.5"/><text x="685.0" y="470.0" text-anchor="middle" fill="var(--accent2)" style="font-size:12px;font-weight:700;">transmission line</text><text x="685.0" y="488.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">d²Ṽ/dz² = γ²Ṽ</text><text x="685.0" y="505.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">γ² = (𝓡 + jω𝓛)</text><text x="685.0" y="522.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;× (𝓖 + jω𝓒)</text><text x="685.0" y="539.0" text-anchor="middle" fill="currentColor" style="font-size:11.2px;">same algebra, V and I</text><text x="685.0" y="556.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L27–30</text><text x="380.0" y="604.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">Read γ off the solution e^(−γz): α = Re γ (decay, Np/m), β = Im γ (phase, rad/m); η = jωμ/γ.</text><text x="380.0" y="622.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Plasma: Kudeki's ECE 458 notes; diffusion vs waves: EM GeoSci, Løseth et al. (2006).</text></svg><figcaption><strong>One equation, many media.</strong> Taking the curl of Faraday's law and substituting Ampère's law gives one time-domain equation with a conduction term (loss) and a displacement term (waves). Drop the conduction term and you have the lossless wave equation of Lectures 18–19; drop the displacement term and it becomes a diffusion equation, the good conductor; at one frequency it becomes the Helmholtz equation, whose γ² covers every medium, a collisionless plasma, and the voltage on a transmission line.</figcaption></figure>
