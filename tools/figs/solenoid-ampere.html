8" marker-end="url(#ahs)" stroke-linecap="round"/><text x="376.0" y="196.0" text-anchor="start" fill="var(--accent2)" style="font-size:11.5px;">C₂:  B<tspan baseline-shift="sub" style="font-size:9px">z</tspan> L = μ₀ (nL) I</text><text x="224.0" y="196.0" text-anchor="end" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">L</text><text x="60.0" y="70.0" text-anchor="middle" fill="var(--hi)" style="font-size:11px;">⊙ out, ⊗ in</text></svg><figcaption><strong>Two Amperian rectangles settle the solenoid.</strong> C₁ links n L turns going one way and n L turns going the other, so its circulation is zero: the field outside is uniform (and, for an isolated infinite coil, zero). C₂ has one leg inside, where it collects B<sub>z</sub>L, and one leg outside where there is nothing; it links n L turns carrying I, so B<sub>z</sub> = μ₀ n I. Seen from a distance the winding is a current sheet of J<sub>s</sub> = nI wrapped into a cylinder, and the result is just the sheet rule: tangential H jumps by J<sub>s</sub> across it, from 0 outside to nI inside.</figcaption></figure>
