6.0" y2="136.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="516.0" y1="136.0" x2="532.0" y2="136.0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="512.0" y="164.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">J·E &lt; 0</text><text x="512.0" y="178.0" text-anchor="middle" fill="currentColor" style="font-size:10.5px;">source</text><text x="480.0" y="254.0" text-anchor="middle" fill="currentColor" style="font-size:13px;">dW/dt = −∮ S · dA − ∫ J·E dV</text><text x="480.0" y="274.0" text-anchor="middle" fill="currentColor" style="font-size:13px;">∂w/∂t + ∇ · S = −J·E</text><text x="480.0" y="298.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">extra term: energy can change form</text><text x="480.0" y="313.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">(heat, motion, chemistry)</text><text x="320.0" y="352.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">density ρ ↔ w,   flux density J ↔ S,   and J·E is the exchange with the rest of the world</text></svg><figcaption><strong>Two ledgers kept the same way.</strong> Left: the continuity equation of Lecture 16. The charge inside a volume changes only by current crossing its surface, because charge is never created or destroyed. Right: Poynting's theorem. The electromagnetic energy stored in a volume (density w) changes by energy flowing out through its surface (flux density <b>S</b> = <b>E</b> × <b>H</b>) <em>and</em> by energy exchanged with the charges inside, at the rate <b>J</b>·<b>E</b> per cubic metre. That second term has no twin on the left, because field energy can turn into other forms. Where <b>J</b>·<b>E</b> &gt; 0 (a resistor) the field loses energy, as heat. Where <b>J</b>·<b>E</b> &lt; 0 (a battery, an antenna current, the radiating sheet of Lecture 19) the current is driven against <b>E</b> and feeds energy into the field.</figcaption><
