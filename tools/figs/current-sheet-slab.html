t of distance, and <em>reversed</em> on the two sides — exactly the structure of the sheet-charge field in Lecture 3, with 'normal' replaced by 'tangential'. Ampère's law around a straddling rectangle gives the magnitude J<sub>s</sub>/2. Smear the current over a slab of thickness W and the step becomes a ramp of slope J<sub>0</sub> that saturates at J<sub>0</sub>W/2, with no jump — just as the slab of charge turned the D-step into a ramp. The jump of tangential <b>H</b> across a sheet, by exactly J<sub>s</sub>, is the boundary condition of Lecture 16.</figcaption></figure>
