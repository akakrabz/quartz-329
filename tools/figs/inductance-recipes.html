<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="30.0" y="34.0" text-anchor="start" fill="var(--accent)" style="font-size:13px;font-weight:600;">capacitance, given the charge (Lecture 10)</text><rect x="18.0" y="44" width="52" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="44.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">Q</text><line x1="72.0" y1="60.0" x2="154.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="113.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Gauss's law</text><rect x="156.0" y="44" width="52" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="182.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">D</text><line x1="210.0" y1="60.0" x2="292.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="251.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">E = D/ε</text><rect x="294.0" y="44" width="52" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="320.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">E</text><line x1="348.0" y1="60.0" x2="430.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="389.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">V = −∫E·dl</text><rect x="432.0" y="44" width="52" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="458.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">V</text><line x1="486.0" y1="60.0" x2="568.0" y2="60.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="527.0" y="50.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">C = Q/V</text><rect x="570.0" y="44" width="52" height="32" rx="7" fill="var(--accent)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="596.0" y="65.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">C</text><text x="30.0" y="114.0" text-anchor="start" fill="var(--accent2)" style="font-size:13px;font-weight:600;">inductance, given the current (Lecture 15)</text><rect x="18.0" y="124" width="52" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="44.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">I</text><line x1="72.0" y1="140.0" x2="154.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="113.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Ampère's law</text><rect x="156.0" y="124" width="52" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="182.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">H</text><line x1="210.0" y1="140.0" x2="292.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="251.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">B = μH</text><rect x="294.0" y="124" width="52" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="320.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">B</text><line x1="348.0" y1="140.0" x2="430.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="389.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">Ψ = ∫B·dS</text><rect x="432.0" y="124" width="52" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="458.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">Ψ</text><line x1="486.0" y1="140.0" x2="568.0" y2="140.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ahs)" stroke-linecap="round"/><text x="527.0" y="130.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">L = NΨ/I</text><rect x="570.0" y="124" width="52" height="32" rx="7" fill="var(--accent2)" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2"/><text x="596.0" y="145.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-weight:600;">L</text><text x="320.0" y="196.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">same geometric factor both times:  C = ε·(factor),  L = μ/(factor)  ⇒  𝓛𝓒 = με for any line</text><text x="320.0" y="216.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">energy:  W = ½CV² = ∫½εE² dV      ↔      W = ½LI² = ∫½μH² dV</text></svg><figcaption><strong>The inductance chain is the capacitance chain with the letters changed.</strong> Capacitance: put charge on the conductors, find <b>D</b> by Gauss's law, divide by ε, integrate to the voltage, take the ratio. Inductance: send current through the conductors, find <b>H</b> by Ampère's law, multiply by μ, integrate to the flux, take the ratio. For a transmission-line geometry the geometric factor that multiplies ε in 𝓒 divides μ in 𝓛, so their product is always με — the fact that sets the wave speed in Unit 4.</figcaption></figure>
