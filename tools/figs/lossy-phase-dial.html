" y="256.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">1.41</text><text x="596.0" y="256.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">0.71</text><text x="418.0" y="276.0" text-anchor="start" fill="currentColor" style="font-size:11px;">4</text><text x="456.0" y="276.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">38.0°</text><text x="504.0" y="276.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">52.0°</text><text x="556.0" y="276.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">2.03</text><text x="596.0" y="276.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">0.49</text><text x="418.0" y="296.0" text-anchor="start" fill="currentColor" style="font-size:11px;">10</text><text x="456.0" y="296.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">42.1°</text><text x="504.0" y="296.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">47.9°</text><text x="556.0" y="296.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">3.17</text><text x="596.0" y="296.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">0.32</text><text x="418.0" y="316.0" text-anchor="start" fill="currentColor" style="font-size:11px;">→ ∞</text><text x="456.0" y="316.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">→ 45°</text><text x="504.0" y="316.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">→ 45°</text><text x="556.0" y="316.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">→ ∞</text><text x="596.0" y="316.0" text-anchor="start" fill="var(--muted)" style="font-size:11px;">→ 0</text><text x="418.0" y="340.0" text-anchor="start" fill="var(--muted)" style="font-size:10.5px;">|γ|, |η| in units of ω√(με), √(μ/ε)</text></svg><figcaption><strong>One number, s = σ/ωε, sets the angles of γ and η.</strong> Both are plotted in the complex plane for s from 0 to 10, normalized by their lossless values ω√(με) and √(μ/ε). The circles trace γ: at s = 0 it sits on the imaginary axis (pure β, no α), and as s grows it leans toward the 45° line, where α = β. The squares trace η: it starts on the real axis at √(μ/ε), shrinks, and leans up toward 45°. Because γη = jωμ, the two angles always add to 90°, so the angle of γ is 90° − τ and α/β = tan τ. The thin rays show s = √3, where τ = 30° and γ points at 60°. The table gives the same curves as numbers. The 45° line itself is the good-conductor limit, which neither curve reaches at finite s.</figcaption></figure>
