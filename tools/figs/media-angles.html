<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20.0" y="24.0" text-anchor="start" fill="currentColor" style="font-size:16px;font-weight:700;">Where the angles come from:  θ (loss angle),  τ = ∠η,  ∠γ</text><text x="20.0" y="43.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">Drawn for tan θ = σ/ωε = 1.19 (θ = 50°); lengths normalized by the lossless values.</text><rect x="14.0" y="56.0" width="238.0" height="254.0" rx="6" fill="none" stroke="var(--muted)" stroke-width="1.0" opacity="0.6"/><text x="24.0" y="76.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:700;">1  the current: (σ + jωε)Ẽ</text><rect x="264.0" y="56.0" width="238.0" height="254.0" rx="6" fill="none" stroke="var(--muted)" stroke-width="1.0" opacity="0.6"/><text x="274.0" y="76.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:700;">2  γ² = jωμ(σ + jωε)  →  γ</text><rect x="514.0" y="56.0" width="238.0" height="254.0" rx="6" fill="none" stroke="var(--muted)" stroke-width="1.0" opacity="0.6"/><text x="524.0" y="76.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:700;">3  η² = jωμ/(σ + jωε)  →  η</text><line x1="34.0" y1="270.0" x2="240.0" y2="270.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="44.0" y1="280.0" x2="44.0" y2="100.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><text x="240.0" y="284.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">Re</text><text x="50.0" y="108.0" text-anchor="start" fill="var(--muted)" style="font-size:10.5px;">Im</text><line x1="44.0" y1="270.0" x2="153.6" y2="270.0" stroke="var(--hi)" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/><line x1="44.0" y1="270.0" x2="44.0" y2="178.0" stroke="var(--accent2)" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/><line x1="153.6" y1="270.0" x2="153.6" y2="178.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="44.0" y1="178.0" x2="153.6" y2="178.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="44.0" y1="270.0" x2="153.6" y2="178.0" stroke="var(--accent)" stroke-width="2.6" marker-end="url(#ah)" stroke-linecap="round"/><path d="M74.6,244.3 A40,40 0 0 0 44.0,230.0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="66.0" y="222.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">θ</text><text x="98.8" y="286.0" text-anchor="middle" fill="var(--hi)" style="font-size:10.5px;font-weight:600;">σẼ: conduction, heats</text><text x="40.0" y="170.0" text-anchor="start" fill="var(--accent2)" style="font-size:10.5px;font-weight:600;">jωεẼ: displacement</text><text x="157.6" y="192.0" text-anchor="start" fill="var(--accent)" style="font-size:10.5px;font-weight:600;">total</text><text x="139.0" y="300.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">tan θ = σ/ωε  (the loss tangent)</text><line x1="274.0" y1="270.0" x2="494.0" y2="270.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="394.0" y1="280.0" x2="394.0" y2="100.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><text x="494.0" y="284.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">Re</text><text x="400.0" y="108.0" text-anchor="start" fill="var(--muted)" style="font-size:10.5px;">Im</text><line x1="394.0" y1="270.0" x2="312.0" y2="172.3" stroke="var(--muted)" stroke-width="2.0" marker-end="url(#ah)" stroke-linecap="round"/><text x="308.0" y="164.3" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;font-weight:600;">γ²  (×j: +90°)</text><line x1="437.2" y1="270.0" x2="437.2" y2="177.3" stroke="var(--hi)" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="394.0" y1="177.3" x2="437.2" y2="177.3" stroke="var(--accent2)" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="394.0" y1="270.0" x2="437.2" y2="177.3" stroke="var(--accent)" stroke-width="2.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="443.2" y="173.3" text-anchor="start" fill="var(--accent)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">γ</text><text x="437.2" y="285.0" text-anchor="middle" fill="var(--hi)" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">α</text><text x="385.0" y="181.3" text-anchor="end" fill="var(--accent2)" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">β</text><path d="M424.0,270.0 A30,30 0 0 0 406.7,242.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="430.0" y="250.0" text-anchor="start" fill="currentColor" style="font-size:10.5px;">65°</text><text x="389.0" y="300.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">√ halves the angle: ∠γ = 90° − θ/2</text><line x1="534.0" y1="270.0" x2="740.0" y2="270.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="544.0" y1="280.0" x2="544.0" y2="100.0" stroke="currentColor" stroke-width="1.1" marker-end="url(#ahs)" stroke-linecap="round"/><text x="740.0" y="284.0" text-anchor="end" fill="var(--muted)" style="font-size:10.5px;">Re</text><text x="550.0" y="108.0" text-anchor="start" fill="var(--muted)" style="font-size:10.5px;">Im</text><line x1="544.0" y1="270.0" x2="612.2" y2="188.8" stroke="var(--muted)" stroke-width="2.0" marker-end="url(#ah)" stroke-linecap="round"/><text x="606.2" y="180.8" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;font-weight:600;">η²: angle θ</text><line x1="544.0" y1="270.0" x2="663.9" y2="214.1" stroke="var(--accent2)" stroke-width="2.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="669.9" y="216.1" text-anchor="start" fill="var(--accent2)" style="font-size:15px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">η</text><path d="M606.0,270.0 A62,62 0 0 0 600.2,243.8" fill="none" stroke="var(--accent2)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="614.0" y="260.0" text-anchor="start" fill="var(--accent2)" style="font-size:11px;font-weight:600;">τ = θ/2 = 25°</text><text x="639.0" y="300.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">H lags E by τ (0° … 45°)</text><text x="380.0" y="334.0" text-anchor="middle" fill="var(--accent)" style="font-size:12.5px;font-weight:600;">τ = θ/2&#160;&#160;&#160;&#160; ∠γ = 90° − τ&#160;&#160;&#160;&#160; α/β = tan τ&#160;&#160;&#160;&#160; |γ| ∝ (1 + tan²θ)^¼,&#160;&#160;|η| ∝ (1 + tan²θ)^−¼</text><text x="380.0" y="352.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">Here |γ|/ω√(με) = 1.25, |η|/√(μ/ε) = 0.80, α/β = 0.47.</text></svg><figcaption><strong>Three angles, one origin.</strong> The total current (σ + jωε)Ẽ leans away from the displacement current by the loss angle θ, with tan θ = σ/ωε. Multiplying by jωμ turns it a further 90° (γ²), and the square root halves the angle, so γ sits at 90° − θ/2, between 45° (good conductor) and 90° (lossless). Dividing instead gives η² at θ, so τ = ∠η = θ/2. The loss tangent is tan θ; τ is half of θ, not the tangent itself.</figcaption></figure>
