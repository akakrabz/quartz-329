;font-weight:700;">𝓡</text><text x="290.0" y="380.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">series loss in the conductors: no plane-wave twin</text><rect x="110.0" y="387.0" width="560.0" height="21.0" rx="0" fill="currentColor" fill-opacity="0.04" stroke="none"/><text x="170.0" y="402.0" text-anchor="middle" fill="var(--accent)" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">η</text><text x="205.0" y="402.0" text-anchor="middle" fill="var(--muted)" style="font-size:13px;">↔</text><text x="240.0" y="402.0" text-anchor="middle" fill="var(--accent)" style="font-size:14px;font-weight:700;">Z<tspan baseline-shift="sub" style="font-size:9px">0</tspan></text><text x="290.0" y="402.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">V/I of one travelling wave</text></svg><figcaption><strong>The dictionary between Units 3 and 4.</strong> For an x-polarized wave travelling along z, Faraday's and Ampère's laws read ∂E<sub>x</sub>/∂z = −μ∂H<sub>y</sub>/∂t and ∂H<sub>y</sub>/∂z = −σE<sub>x</sub> − ε∂E<sub>x</sub>/∂t; the telegrapher's equations of a line are the same with V, I, 𝓛, 𝓖 and 𝓒 in their places. So γ = √((𝓡 + jω𝓛)(𝓖 + jω𝓒)) and Z<sub>0</sub> = √((𝓡 + jω𝓛)/(𝓖 + jω𝓒)) are the plane-wave γ and η with one extra term, the series resistance of the wires.</figcaption></figure>
