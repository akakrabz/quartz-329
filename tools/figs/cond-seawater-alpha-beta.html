x1="445.2" y1="517.0" x2="445.2" y2="523.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><line x1="496.8" y1="517.0" x2="496.8" y2="523.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><line x1="548.4" y1="517.0" x2="548.4" y2="523.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><line x1="600.0" y1="517.0" x2="600.0" y2="523.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="84.0" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">10 Hz</text><text x="187.2" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">1 kHz</text><text x="290.4" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">100 kHz</text><text x="393.6" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">10 MHz</text><text x="496.8" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">1 GHz</text><text x="600.0" y="535.0" text-anchor="middle" fill="var(--muted)" style="font-size:10px;">100 GHz</text><text x="606.0" y="524.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">f</text><text x="320.0" y="568.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">dashed grey: the good-conductor and imperfect-dielectric approximations;  dotted: σ = ωε</text></svg><figcaption><strong>One medium, both regimes.</strong> The curves are the exact α, β, |η| and τ = ∠η of seawater, computed from γ = √(jωμ(σ + jωε)) and η = √(jωμ/(σ + jωε)). Below about 90 MHz (blue band, σ/ωε &gt; 10) the good-conductor formulas hold: α and β are equal and both grow as √f, |η| = √(ωμ/σ) is far below the lossless √(μ/ε) (0.044 Ω at 1 kHz, 1.4 Ω at 1 MHz), and η has a phase of 45°. Above about 9 GHz (green band, σ/ωε &lt; 0.1) the imperfect-dielectric formulas take over: β grows in proportion to f, |η| levels off at √(μ/ε) = 42 Ω, the phase drops toward zero, and α stops growing at (σ/2)√(μ/ε) = 84 Np/m, a penetration depth of 1.2 cm that no higher frequency improves. Between the bands, use the exact formulas. The red dots are the notes' 1 kHz examples (δ = 7.96 m) and seawater at 1 GHz, where α is about 600 times larger. The constant ε = 81ε₀ is itself an approximation above a few GHz.</figcaption></figure>
