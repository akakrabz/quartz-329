velength λ = 2π/β. An eighth of a period later the whole pattern has slid λ/8 toward +z (dashed). This is the notes' page-3 picture: in a time t the crests move (ω/β)t, so the phase velocity is v<sub>p</sub> = ω/β = λ/T = λf. β plays in space the role ω plays in time: it is a spatial frequency.</figcaption></figure>
