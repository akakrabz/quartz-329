ambria Math','Times New Roman',serif;font-style:italic;font-weight:600;">J</text><text x="460.0" y="228.0" text-anchor="middle" fill="currentColor" style="font-size:13.5px;font-weight:600;">∮J·dS = −dQ/dt</text><text x="460.0" y="250.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">⇒  ∇·J = −∂ρ/∂t   (continuity equation)</text><text x="460.0" y="24.0" text-anchor="middle" fill="var(--muted)" style="font-size:12px;">the divergence theorem turns the bucket into a point law</text></svg><figcaption><strong>Charge conservation as a bookkeeping law.</strong> Current flowing into a region raises the charge inside; current flowing out lowers it; nothing else changes it. For any closed surface the net outward current ∮<b>J</b>·d<b>S</b> is therefore the rate of <em>decrease</em> of the enclosed charge. The divergence theorem converts that into a statement at a point, ∇·<b>J</b> = −∂ρ/∂t: where current lines diverge, charge is being depleted. Lecture 8 used exactly this (with <b>J</b> = σ<b>E</b> and Gauss's law) to get the relaxation time ε/σ; Lecture 16 uses it to find what is missing from Ampère's law.</figcaption></figure>
