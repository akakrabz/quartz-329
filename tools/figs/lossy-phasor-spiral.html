s in z, not in t</text></svg><figcaption><strong>What γ and the angle of η do to the phasors.</strong> Panel 1 plots the tip of Ẽ(z)/E<sub>0</sub> = e<sup>−αz</sup>e<sup>−jβz</sup> in the complex plane, computed for τ = 15° (σ/ωε = tan 30°, α/β = tan 15°). In a lossless medium the tip would go round the dotted unit circle, once per wavelength. With loss it spirals inward: e<sup>−jβz</sup> turns it clockwise and e<sup>−αz</sup> shrinks it, by e<sup>−2π tan τ</sup> ≈ 0.19 per turn here. H̃ = Ẽ/η is the same spiral divided by |η| and turned a further τ clockwise. Panel 2 projects the rotating phasors onto the real axis at z = 0. Both fields are steady sinusoids in time, and H reaches each peak τ/ω after E. Elsewhere the two curves are smaller by e<sup>−αz</sup> and shifted by βz, and the lag is still τ.</figcaption></figure>
