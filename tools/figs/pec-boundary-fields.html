.2" y1="155.2" x2="382.8" y2="160.8" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><line x1="377.2" y1="160.8" x2="382.8" y2="155.2" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><rect x="450.0" y="150.0" width="160.0" height="60.0" rx="0" fill="currentColor" stroke="none" stroke-width="1.5" opacity="0.22"/><line x1="450.0" y1="150.0" x2="610.0" y2="150.0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="530.0" y="186.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">perfect conductor</text><text x="530.0" y="40.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;font-weight:600;">normal field</text><line x1="530.0" y1="142.0" x2="530.0" y2="98.0" stroke="var(--accent)" stroke-width="2.6" marker-end="url(#ah)" stroke-linecap="round"/><text x="530.0" y="62.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:600;">E only</text><text x="530.0" y="78.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">ending on surface charge</text><text x="530.0" y="93.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;font-weight:600;">n̂ · D = ρₛ</text><text x="470.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">+</text><text x="500.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">+</text><text x="530.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">+</text><text x="560.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">+</text><text x="590.0" y="162.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:700;">+</text><text x="320.0" y="236.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;font-weight:600;">E meets a perfect conductor head-on; H slides along it</text></svg><figcaption><strong>What can exist at the surface of a perfect conductor.</strong> Inside, <b>E</b> = 0 and (by the course's convention) <b>H</b> = 0. Tangential <b>E</b> is continuous, so it must vanish just outside: <b>E</b> arrives <em>normal</em> to the surface and ends on surface charge ρ<sub>s</sub> = n̂·<b>D</b>. Normal <b>B</b> is continuous, so it too must vanish: <b>H</b> runs <em>tangent</em> to the surface, and its full value is carried by a surface current, <b>J</b><sub>s</sub> = n̂×<b>H</b>. An oblique arrow can be neither field. These two facts are what every reflection problem in Unit 3 and every transmission-line problem in Unit 4 is built on.</figcaption></figure>
