uous: H = 0.1 x̂ A/m in the slab</text><text x="384.0" y="144.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;font-weight:600;">3.  the medium sets B and M</text><text x="384.0" y="162.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">B = μ₀μᵣH = 1.26×10⁻⁵ x̂ T  (12.6 μT)</text><text x="384.0" y="178.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">M = χₘH = 99 × 0.1 = 9.9 x̂ A/m</text><text x="384.0" y="204.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;font-weight:600;">4.  check with the bound currents</text><text x="384.0" y="222.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">M × n̂ = ∓9.9 ŷ A/m: same sense as</text><text x="384.0" y="238.0" text-anchor="start" fill="currentColor" style="font-size:11.5px;">the free sheets; 0.1 + 9.9 = 10 A/m</text><text x="384.0" y="254.0" text-anchor="start" fill="var(--accent2)" style="font-size:11.5px;">B = μ₀ (10 A/m) = 100 μ₀H  ✓</text><text x="384.0" y="282.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">μᵣ = 1: same H, B = 0.126 μT, M = 0</text></svg><figcaption><strong>The slide example: a magnetic slab between two opposite current sheets.</strong> The free sheets (red; −0.1 ŷ A/m on top, out of the page, and +0.1 ŷ A/m below, into it) are all that <b>H</b> knows about: each contributes ½<b>J</b><sub>s</sub> × n̂ = 0.05 x̂ A/m between them and the contributions cancel outside. The slab faces carry no free current, so tangential <b>H</b> passes into the slab unchanged — the same 0.1 x̂ A/m as with no slab at all. The material then sets <b>B</b> = μ<b>H</b> (100 times larger) and <b>M</b> = χ<sub>m</sub><b>H</b> = 9.9 x̂ A/m. The check: <b>M</b> × n̂ puts magnetization currents ∓9.9 ŷ A/m on the slab faces (green), in the same sense as the free sheets; free plus bound, 10 A/m per face, inserted in the <em>vacuum</em> sheet formula gives B = μ₀ × 10 A/m = 100 μ₀H inside the slab, and still μ₀H in any gap between a sheet and the slab.</figcaption></figure>
