2="64.0" y2="282.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ahs)" stroke-linecap="round"/><text x="68.0" y="286.0" text-anchor="start" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><circle cx="30.0" cy="282.0" r="5.0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="30.0" cy="282.0" r="1.8" fill="currentColor" stroke="none" stroke-width="1.5"/><text x="22.0" y="286.0" text-anchor="end" fill="currentColor" style="font-size:12px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">y</text></svg><figcaption><strong>The slides' source: an infinite sheet of current in the plane z = 0, seen edge-on.</strong> The page is the xz-plane (x up, z right, y out of the page — a right-handed frame). Left: the Lecture 13 case, a steady sheet current J<sub>s</sub> = −J<sub>s</sub> x̂. Ampère's law gives <b>H</b> = ½<b>J</b><sub>s</sub> × n̂ — out of the page (⊙, +ŷ) for z &gt; 0, into it (⊗, −ŷ) for z &lt; 0 — and no <b>E</b>. Right: let J<sub>s</sub> vary in time. Symmetry and the source-free equations still allow only E<sub>x</sub>(z,t) and H<sub>y</sub>(z,t), but now both are nonzero. The arrows show the directions next to the sheet while J<sub>s</sub> &gt; 0: <b>E</b> points along +x̂, opposite to <b>J</b><sub>s</sub> (the in-class ink), and <b>H</b> has the same pattern as in the static case. Check one side: x̂ × ŷ = +ẑ on the right and x̂ × (−ŷ) = −ẑ on the left. So <b>E</b> × <b>H</b> points away from the sheet on both sides, which is the direction the waves travel. Lecture 19 derives how strong these fields are.</figcaption></figure>
