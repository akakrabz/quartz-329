<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><line x1="150.0" y1="280.0" x2="150.0" y2="30.0" stroke="currentColor" stroke-width="3.5" marker-end="url(#ah)" stroke-linecap="round"/><text x="160.0" y="36.0" text-anchor="start" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><line x1="128.0" y1="220.0" x2="128.0" y2="170.0" stroke="currentColor" stroke-width="2" marker-end="url(#ah)" stroke-linecap="round"/><text x="120.0" y="198.0" text-anchor="end" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">I</text><line x1="150.0" y1="105.0" x2="150.0" y2="85.0" stroke="var(--hi)" stroke-width="6" stroke-linecap="round"/><text x="138.0" y="99.0" text-anchor="end" fill="var(--hi)" style="font-size:12.5px;font-weight:600;">I dz ẑ</text><line x1="150.0" y1="190.0" x2="340.0" y2="190.0" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><text x="245.0" y="208.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">r</text><circle cx="340.0" cy="190.0" r="4.0" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><text x="350.0" y="194.0" text-anchor="start" fill="currentColor" style="font-size:14px;">P</text><line x1="150.0" y1="95.0" x2="334.0" y2="187.0" stroke="var(--accent)" stroke-width="2" marker-end="url(#ah)" stroke-linecap="round"/><text x="261.0" y="132.5" text-anchor="start" fill="var(--accent)" style="font-size:12.5px;">R = √(r² + z²)</text><path d="M306.0,190.0 A34,34 0 0 0 309.6,174.8" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="292.0" y="180.0" text-anchor="middle" fill="var(--muted)" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">α</text><line x1="158.0" y1="95.0" x2="158.0" y2="190.0" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round"/><text x="166.0" y="146.5" text-anchor="start" fill="var(--muted)" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><circle cx="340.0" cy="226.0" r="9.0" fill="none" stroke="var(--accent2)" stroke-width="1.4"/><line x1="334.4" y1="220.4" x2="345.6" y2="231.6" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><line x1="334.4" y1="231.6" x2="345.6" y2="220.4" stroke="var(--accent2)" stroke-width="1.4" stroke-linecap="round"/><text x="340.0" y="252.0" text-anchor="middle" fill="var(--accent2)" style="font-size:12px;font-weight:600;">dB: into page (φ̂)</text><text x="415.0" y="60.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;font-weight:600;">dB = μ₀ I dl × R̂ /(4πR²)</text><text x="415.0" y="86.0" text-anchor="start" fill="currentColor" style="font-size:12px;">|dl × R̂| = dz cos α = dz · r/R</text><text x="415.0" y="110.0" text-anchor="start" fill="currentColor" style="font-size:12px;">dB = μ₀ I r dz /(4π(r²+z²)³ᐟ²)</text><line x1="415.0" y1="126.0" x2="625.0" y2="126.0" stroke="var(--muted)" stroke-width="1" stroke-linecap="round"/><text x="415.0" y="150.0" text-anchor="start" fill="currentColor" style="font-size:12px;">∫ dz/(r²+z²)³ᐟ² = 2/r²  (−∞ to ∞)</text><text x="415.0" y="186.0" text-anchor="start" fill="var(--accent)" style="font-size:15px;font-weight:700;">B = μ₀ I /(2π r)  φ̂</text><text x="415.0" y="214.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">all elements point along φ̂:</text><text x="415.0" y="230.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">no cancellation, one integral</text></svg><figcaption><strong>Biot–Savart is Coulomb's law for current elements.</strong> Each element I d<b>l</b> contributes a field d<b>B</b> that falls off as 1/R² and points along d<b>l</b> × <b>R̂</b>, with <b>R</b> drawn <em>from the element to the field point</em>. For a straight wire every element's contribution points the same way — around the wire — so the five-step recipe of Lecture 2 reduces to one scalar integral, and the result is the 1/r field that the relativistic argument produced. Compare the line charge of Lecture 2: same integral, same 1/r, but the electric field points <em>away</em> from the line while the magnetic field circles it.</figcaption></figure>
