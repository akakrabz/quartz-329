29.2,253.5 L447.2,252.4 L457.0,250.9 L465.3,248.7 L472.7,245.5 L479.4,241.4 L485.2,236.3 L490.7,230.3 L507.2,207.7 L510.3,204.8 L512.6,204.0 L514.6,204.7 L516.6,207.0 L518.1,210.4 L519.7,215.6 L522.4,230.3 L525.2,254.0 L600.0,254.0" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="334.0" y="226.5" text-anchor="start" fill="var(--muted)" style="font-size:11px;">t = 0</text><text x="492.7" y="208.0" text-anchor="end" fill="var(--accent)" style="font-size:11px;font-weight:600;">t = 8 ns</text><line x1="313.6" y1="194.0" x2="512.7" y2="194.0" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="413.1" y="188.0" text-anchor="middle" fill="currentColor" style="font-size:11px;">c × 8 ns = 2.4 m</text><text x="531.1" y="241.5" text-anchor="start" fill="var(--hi)" style="font-size:11px;font-weight:600;">front</text><text x="20.0" y="302.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-weight:600;">3  −z wave:  E<tspan baseline-shift="sub" style="font-size:9px">x</tspan> = f(t + z/v)  — snapshot has the record's order</text><line x1="40.0" y1="398.0" x2="610.0" y2="398.0" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)" stroke-linecap="round"/><text x="614.0" y="402.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><line x1="76.9" y1="395.0" x2="76.9" y2="401.0" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><text x="76.9" y="413.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">-3</text><line x1="159.9" y1="395.0" x2="159.9" y2="401.0" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><text x="159.9" y="413.0" text-anchor="middle" fill="var(--muted)" style="font-size:10.5px;">-2</text><line x1="243.0" y1="395.0" x2="243.0" y2="401.0" stroke="currentColor ext-anchor="start" fill="var(--accent)" style="font-size:11px;font-weight:600;">t = 8 ns</text><line x1="338.4" y1="338.0" x2="139.3" y2="338.0" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="238.9" y="332.0" text-anchor="middle" fill="currentColor" style="font-size:11px;">c × 8 ns = 2.4 m</text><text x="120.9" y="385.5" text-anchor="end" fill="var(--hi)" style="font-size:11px;font-weight:600;">front</text></svg><figcaption><strong>One waveform, two directions of travel.</strong> Row 1 is what a probe at z = 0 records: a pulse that rises in about half a nanosecond and decays over a few nanoseconds. Rows 2 and 3 are snapshots in space at t = 0 (dashed) and t = 8 ns (solid), computed from f(t ∓ z/v) with v = c. Both pulses move without changing shape, 2.4 m in 8 ns. The steep front always leads, so the <em>spatial</em> picture of a +z wave is the time record reversed left-to-right (E<sub>x</sub>(z,0) = f(−z/v)). The −z wave keeps the record's left-to-right order (E<sub>x</sub>(z,0) = f(z/v)). Forgetting this reversal is the commonest error when a problem gives the pulse at one instant and asks what a probe will see.</figcaption></figure>
