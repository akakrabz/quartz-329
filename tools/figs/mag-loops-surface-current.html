var(--accent2)" style="font-size:11.5px;font-weight:600;">B ≈ μ₀M inside  (like μ₀nI)</text><text x="438.0" y="202.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">M, nI and J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> are all in A/m</text></svg><figcaption><strong>Why a magnetized body behaves like a coil.</strong> Left: model the material as a lattice of identical atomic current loops, each circulating counter-clockwise as you look at it (moment out of the page). Wherever two loops share an edge their currents run in opposite directions and cancel; only the outer edges have no partner, so the net effect of a <em>uniform</em> magnetization is a single current circulating around the boundary. With loops of current I on cells of side s, M = I s²/s³ = I/s — exactly the current per unit length on the boundary, so the surface magnetization current is <b>J</b><sub>sM</sub> = <b>M</b> × n̂ in A/m. If M varies from cell to cell the shared edges no longer cancel and a volume current ∇×<b>M</b> is left inside. Right: a uniformly magnetized rod therefore carries a sheet of current around its side, like a solenoid's winding with nI replaced by M, and none on its end faces; a long rod with no free current has B ≈ μ₀M inside, the solenoid's μ₀nI.</figcaption></figure>
