<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="20.0" y="24.0" text-anchor="start" fill="currentColor" style="font-size:18px;font-weight:700;">Wave parameters: who is computed from whom</text><text x="20.0" y="44.0" text-anchor="start" fill="var(--muted)" style="font-size:12.5px;">Given a medium and a frequency, everything else follows from two complex numbers, γ and η.</text><text x="120.0" y="72.0" text-anchor="middle" fill="var(--muted)" style="font-size:13px;font-weight:700;">1 · what you are given</text><text x="380.0" y="72.0" text-anchor="middle" fill="var(--muted)" style="font-size:13px;font-weight:700;">2 · the two complex numbers</text><text x="640.0" y="72.0" text-anchor="middle" fill="var(--muted)" style="font-size:13px;font-weight:700;">3 · what the wave shows</text><rect x="20.0" y="84.0" width="200.0" height="118.0" rx="8" fill="var(--accent)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="20.0" y="84.0" width="200.0" height="118.0" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.6"/><text x="120.0" y="103.0" text-anchor="middle" fill="var(--accent)" style="font-size:14px;font-weight:700;">Medium</text><text x="120.0" y="122.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">μ = μ<tspan baseline-shift="sub" style="font-size:9px">r</tspan>μ₀&#160;&#160;&#160;(almost always μ₀)</text><text x="120.0" y="139.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">ε = ε<tspan baseline-shift="sub" style="font-size:9px">r</tspan>ε₀,&#160;&#160;&#160;n = √(μ<tspan baseline-shift="sub" style="font-size:9px">r</tspan>ε<tspan baseline-shift="sub" style="font-size:9px">r</tspan>)</text><text x="120.0" y="156.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">σ&#160;&#160;&#160;[S/m]&#160;&#160;conduction</text><text x="120.0" y="173.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">p = σ/ωε&#160;&#160;loss tangent = tan θ</text><rect x="20.0" y="222.0" width="200.0" height="70.0" rx="8" fill="var(--accent)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="20.0" y="222.0" width="200.0" height="70.0" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.6"/><text x="120.0" y="241.0" text-anchor="middle" fill="var(--accent)" style="font-size:14px;font-weight:700;">Signal</text><text x="120.0" y="260.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">ω = 2πf&#160;&#160;&#160;[rad/s]</text><text x="120.0" y="277.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">(the only thing you control)</text><rect x="265.0" y="84.0" width="230.0" height="112.0" rx="8" fill="var(--accent2)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="265.0" y="84.0" width="230.0" height="112.0" rx="8" fill="none" stroke="var(--accent2)" stroke-width="1.6"/><text x="380.0" y="103.0" text-anchor="middle" fill="var(--accent2)" style="font-size:14px;font-weight:700;">γ = α + jβ&#160;&#160;&#160;[1/m]</text><text x="380.0" y="122.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">γ = √( jωμ (σ + jωε) )</text><text x="380.0" y="139.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">α [Np/m]: how fast it decays</text><text x="380.0" y="156.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">β [rad/m]: how fast phase turns</text><text x="380.0" y="173.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">e^(−γz) = e^(−αz) e^(−jβz)</text><rect x="265.0" y="222.0" width="230.0" height="112.0" rx="8" fill="var(--accent2)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="265.0" y="222.0" width="230.0" height="112.0" rx="8" fill="none" stroke="var(--accent2)" stroke-width="1.6"/><text x="380.0" y="241.0" text-anchor="middle" fill="var(--accent2)" style="font-size:14px;font-weight:700;">η = |η| e^(jτ)&#160;&#160;&#160;[Ω]</text><text x="380.0" y="260.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">η = √( jωμ / (σ + jωε) )</text><text x="380.0" y="277.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">|η|: ratio |E| / |H|</text><text x="380.0" y="294.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">τ = ∠η: H lags E by τ</text><text x="380.0" y="311.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">τ = θ/2&#160;&#160;(0 … 45°)</text><line x1="380.0" y1="196.0" x2="380.0" y2="222.0" stroke="var(--accent2)" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/><rect x="300.0" y="200.0" width="160.0" height="20.0" rx="4" fill="var(--accent2)" stroke="none" stroke-width="1.5" opacity="0.18"/><text x="340.0" y="214.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">γη = jωμ</text><text x="425.0" y="214.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">γ/η = σ + jωε</text><line x1="220.0" y1="143.0" x2="262.0" y2="130.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="220.0" y1="257.0" x2="262.0" y2="268.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="220.0" y1="150.0" x2="262.0" y2="262.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" opacity="0.6" stroke-linecap="round"/><line x1="220.0" y1="250.0" x2="262.0" y2="136.0" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#ah)" opacity="0.6" stroke-linecap="round"/><rect x="540.0" y="84.0" width="200.0" height="72.0" rx="8" fill="var(--hi)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="540.0" y="84.0" width="200.0" height="72.0" rx="8" fill="none" stroke="var(--hi)" stroke-width="1.6"/><text x="640.0" y="103.0" text-anchor="middle" fill="var(--hi)" style="font-size:14px;font-weight:700;">from α</text><text x="640.0" y="122.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">δ = 1/α&#160;&#160;&#160;[m]&#160;&#160;penetration depth</text><text x="640.0" y="139.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">|E| ∝ e^(−z/δ),&#160;&#160;⟨S⟩ ∝ e^(−2z/δ)</text><rect x="540.0" y="166.0" width="200.0" height="90.0" rx="8" fill="var(--hi)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="540.0" y="166.0" width="200.0" height="90.0" rx="8" fill="none" stroke="var(--hi)" stroke-width="1.6"/><text x="640.0" y="185.0" text-anchor="middle" fill="var(--hi)" style="font-size:14px;font-weight:700;">from β</text><text x="640.0" y="204.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">λ = 2π/β&#160;&#160;&#160;[m]</text><text x="640.0" y="221.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = ω/β&#160;&#160;&#160;[m/s]</text><text x="640.0" y="238.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">v<tspan baseline-shift="sub" style="font-size:9px">g</tspan> = dω/dβ&#160;&#160;(the message)</text><rect x="540.0" y="266.0" width="200.0" height="72.0" rx="8" fill="var(--hi)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="540.0" y="266.0" width="200.0" height="72.0" rx="8" fill="none" stroke="var(--hi)" stroke-width="1.6"/><text x="640.0" y="285.0" text-anchor="middle" fill="var(--hi)" style="font-size:14px;font-weight:700;">from η</text><text x="640.0" y="304.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">H̃ = (ẑ × Ẽ)/η&#160;&#160;for +z travel</text><text x="640.0" y="321.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;">|H| = |E|/|η|,&#160;&#160;phase −τ</text><line x1="495.0" y1="120.0" x2="538.0" y2="120.0" stroke="var(--accent2)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="495.0" y1="160.0" x2="538.0" y2="205.0" stroke="var(--accent2)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><line x1="495.0" y1="290.0" x2="538.0" y2="300.0" stroke="var(--accent2)" stroke-width="1.8" marker-end="url(#ah)" stroke-linecap="round"/><text x="20.0" y="362.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;font-weight:700;">The regimes — one number, p = σ/ωε, decides which simplification applies</text><line x1="40.0" y1="384.0" x2="720.0" y2="384.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round"/><text x="40.0" y="402.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">p = 0</text><text x="260.0" y="402.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">p = 0.1</text><text x="500.0" y="402.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">p = 10</text><text x="720.0" y="402.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">p → ∞</text><line x1="260.0" y1="378.0" x2="260.0" y2="390.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="500.0" y1="378.0" x2="500.0" y2="390.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="20.0" y="414.0" width="225.0" height="128.0" rx="8" fill="var(--accent)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="20.0" y="414.0" width="225.0" height="128.0" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.6"/><text x="132.5" y="433.0" text-anchor="middle" fill="var(--accent)" style="font-size:13px;font-weight:700;">perfect dielectric&#160;&#160;(σ = 0)</text><text x="132.5" y="453.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">α = 0,&#160;&#160;δ = ∞</text><text x="132.5" y="471.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">β = ω√(με) = nω/c</text><text x="132.5" y="489.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">η = √(μ/ε) = η₀/n&#160;&#160;(real)</text><text x="132.5" y="507.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">τ = 0: E and H in phase</text><text x="132.5" y="525.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = 1/√(με) = c/n</text><rect x="268.0" y="414.0" width="225.0" height="128.0" rx="8" fill="var(--accent2)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="268.0" y="414.0" width="225.0" height="128.0" rx="8" fill="none" stroke="var(--accent2)" stroke-width="1.6"/><text x="380.5" y="433.0" text-anchor="middle" fill="var(--accent2)" style="font-size:13px;font-weight:700;">imperfect dielectric&#160;&#160;(p ≪ 1)</text><text x="380.5" y="453.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">α ≈ (σ/2)√(μ/ε)&#160;&#160;&#160;(σ-controlled)</text><text x="380.5" y="471.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">β ≈ ω√(με)&#160;&#160;&#160;(unchanged)</text><text x="380.5" y="489.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">|η| ≈ √(μ/ε),&#160;&#160;τ ≈ p/2&#160;&#160;rad</text><text x="380.5" y="507.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">δ ≈ (2/σ)√(ε/μ):&#160;&#160;f-independent</text><text x="380.5" y="525.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">many wavelengths per δ</text><rect x="516.0" y="414.0" width="224.0" height="128.0" rx="8" fill="var(--hi)" stroke="none" stroke-width="1.5" opacity="0.1"/><rect x="516.0" y="414.0" width="224.0" height="128.0" rx="8" fill="none" stroke="var(--hi)" stroke-width="1.6"/><text x="628.0" y="433.0" text-anchor="middle" fill="var(--hi)" style="font-size:13px;font-weight:700;">good conductor&#160;&#160;(p ≫ 1)</text><text x="628.0" y="453.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">α = β = 1/δ</text><text x="628.0" y="471.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">δ = 1/√(πfμσ) = √(2/ωμσ)</text><text x="628.0" y="489.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">η = (1+j)/(σδ),&#160;&#160;τ = 45°</text><text x="628.0" y="507.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">λ = 2πδ,&#160;&#160;v<tspan baseline-shift="sub" style="font-size:9px">p</tspan> = ωδ&#160;&#160;(slow)</text><text x="628.0" y="525.0" text-anchor="middle" fill="currentColor" style="font-size:12px;">gone within one wavelength</text><text x="20.0" y="590.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">Between 0.1 and 10 use the exact γ and η (polar form: 1 − jp = √(1+p²) e^(−jθ)). Lossless limit of every formula: set σ = 0.</text></svg><figcaption>The wave-parameter map. Left: what a problem gives you (μ, ε, σ and ω). Middle: the two complex numbers built from them, tied together by γη = jωμ and γ/η = σ + jωε. Right: what each part of γ and η does to the wave. Bottom: the loss tangent p = σ/ωε picks the regime and its simplifications.</figcaption></figure>
