"320.0" y="402.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">Dot k is the arrow at t = kT/8 (drawn with θ = 30°); the same k marks a(t) at that instant.</text></svg><figcaption><strong>A phasor is the starting position of a turning arrow.</strong> The complex number Ãe<sup>jωt</sup> = Ae<sup>j(ωt+θ)</sup> runs counterclockwise around a circle of radius A, once per period (dots 0–7 are eighths of a period). Its shadow on the real axis is a(t) = A cos(ωt + θ), plotted on the right with the same numbering. So the phasor Ã = Ae<sup>jθ</sup> (the arrow at t = 0) holds the amplitude and the phase, and the agreed frequency ω does the rest. Multiplying by −j turns the arrow back a quarter turn, to where Ã was a quarter period earlier, so its shadow (dashed) peaks a quarter period later: that is why a sine has phasor −jA. Multiplying by j turns it forward a quarter turn: the derivative of a(t) peaks a quarter period earlier, which is why d/dt becomes jω.</figcaption></figure>
