w Roman',serif;font-style:italic;">L</text><line x1="100.0" y1="36.0" x2="160.0" y2="36.0" stroke="var(--hi)" stroke-width="2" marker-end="url(#ah)" stroke-linecap="round"/><text x="130.0" y="28.0" text-anchor="middle" fill="var(--hi)" style="font-size:12.5px;">I(t)</text><text x="130.0" y="236.0" text-anchor="middle" fill="currentColor" style="font-size:11.5px;">KVL:  R I = −L dI/dt  (self-emf = rise)</text><text x="130.0" y="254.0" text-anchor="middle" fill="currentColor" style="font-size:12.5px;font-weight:600;">I(t) = I(0) exp(−t/τ),  τ = L/R</text><line x1="300.0" y1="200.0" x2="600.0" y2="200.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-linecap="round"/><line x1="300.0" y1="200.0" x2="300.0" y2="50.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-linecap="round"/><text x="604.0" y="204.0" text-anchor="start" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">t</text><path d="M300.0,70.0 L305.0,78.4 L310.0,86.2 L315.0,93.6 L320.0,100.4 L325.0,106.9 L330.0,112.9 L335.0,118.5 L340.0,123.7 L345.0,128.7 L350.0,133.3 L355.0,137.6 L360.0,141.6 L365.0,145.4 L370.0,148.9 L375.0,152.2 L380.0,155.3 L385.0,158.1 L390.0,160.8 L395.0,163.4 L400.0,165.7 L405.0,167.9 L410.0,170.0 L415.0,171.9 L420.0,173.8 L425.0,175.4 L430.0,177.0 L435.0,178.5 L440.0,179.9 L445.0,181.2 L450.0,182.4 L455.0,183.5 L460.0,184.6 L465.0,185.6 L470.0,186.5 L475.0,187.4 L480.0,188.2 L485.0,189.0 L490.0,189.7 L495.0,190.3 L500.0,191.0 L505.0,191.5 L510.0,192.1 L515.0,192.6 L520.0,193.1 L525.0,193.5 L530.0,193.9 L535.0,194.3 L540.0,194.7 L545.0,195.0 L550.0,195.4 L555.0,195.7 L560.0,195.9 L565.0,196.2 L570.0,196.4 L575.0,196.7 L580.0,196.9 L585.0,197.1 L590.0,197.3 L595.0,197.5 L600.0,197.6" fill="none" stroke="var(--hi)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="300.0" y1="70.0" x2="375.0" y2="200.0" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="375.0" y1="200.0" x2="375.0" y2="206.0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><text x="375.0" y="222.0" text-anchor="middle" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">τ</text><text x="294.0" y="74.0" text-anchor="end" fill="currentColor" style="font-size:12px;">I(0)</text><text x="385.0" y="146.2" text-anchor="start" fill="var(--muted)" style="font-size:11px;">I(0)/e</text><text x="450.0" y="36.0" text-anchor="middle" fill="currentColor" style="font-size:13px;font-weight:600;">same curve, two circuits</text><text x="450.0" y="248.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">RC (Lecture 10): V = V(0) exp(−t/τ),  τ = RC</text><text x="450.0" y="266.0" text-anchor="middle" fill="var(--muted)" style="font-size:11px;">RL (Lecture 15): I = I(0) exp(−t/τ),  τ = L/R</text></svg><figcaption><strong>Dual circuits, dual time constants.</strong> A capacitor left to itself across a resistor loses its voltage as e<sup>−t/RC</sup>; an inductor shorted through a resistor loses its current as e<sup>−t/(L/R)</sup>. In the RL loop the self-emf −L dI/dt is a voltage <em>rise</em> in the direction of the current that exactly matches the drop RI; the current cannot stop abruptly because that would require an infinite emf. Large C makes a slowly varying voltage source; large L makes a slowly varying current source. The tangent at t = 0 reaches zero at t = τ in both cases — a quick way to read τ off a plot.</figcaption></figure>
