<figure class="ece-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1288" width="760" height="1288" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:14px"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="24.0" y="42.0" text-anchor="start" fill="var(--accent2)" style="font-size:30px;font-weight:700;">FROM ANTENNA TO RECEIVER</text><text x="24.0" y="68.0" text-anchor="start" fill="currentColor" style="font-size:16px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">a wave's journey through free space, told in four stops</text><text x="736.0" y="36.0" text-anchor="end" fill="var(--muted)" style="font-size:12px;">ECE 329 · HW8 #5</text><text x="736.0" y="52.0" text-anchor="end" fill="var(--muted)" style="font-size:12px;">version B · narrative flow</text><line x1="24.0" y1="84.0" x2="736.0" y2="84.0" stroke="var(--accent2)" stroke-width="1.2" stroke-linecap="round"/><line x1="58.0" y1="152.0" x2="58.0" y2="724.0" stroke="var(--hi)" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.6" stroke-linecap="round"/><rect x="24.0" y="98.0" width="712.0" height="190.0" rx="8" fill="var(--accent2)" fill-opacity="0.07" stroke="none"/><circle cx="58.0" cy="132.0" r="20.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><text x="58.0" y="140.0" text-anchor="middle" fill="white" style="font-size:22px;font-weight:700;">1</text><text x="92.0" y="134.0" text-anchor="start" fill="var(--accent2)" style="font-size:21px;font-weight:700;">A current launches it</text><text x="92.0" y="154.0" text-anchor="start" fill="var(--muted)" style="font-size:13px;">the source: a sheet of current J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> (an idealized antenna)</text><text x="300.0" y="182.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">Shake charges and the field must respond. Right at a</text><text x="300.0" y="202.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">current sheet the field on BOTH sides is  E = −η<tspan baseline-shift="sub" style="font-size:9px">0</tspan>J<tspan baseline-shift="sub" style="font-size:9px">s</tspan>/2 :</text><text x="300.0" y="222.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">it points AGAINST the current, with magnitude</text><text x="300.0" y="242.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">(η<tspan baseline-shift="sub" style="font-size:9px">0</tspan>/2) J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> = 188 Ω × J<tspan baseline-shift="sub" style="font-size:9px">s</tspan>.  H = J<tspan baseline-shift="sub" style="font-size:9px">s</tspan>/2 completes the pair,</text><text x="300.0" y="262.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">and E × H points away from the sheet on each side.</text><text x="300.0" y="280.0" text-anchor="start" fill="var(--hi)" style="font-size:13px;font-weight:600;">e.g. J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> = 1 mA/m → |E| = 0.188 V/m, |H| = 0.5 mA/m</text><rect x="167.0" y="186.0" width="6.0" height="76.0" rx="0" fill="var(--hi)" fill-opacity="0.5" stroke="none"/><line x1="170.0" y1="211.0" x2="170.0" y2="193.0" stroke="var(--hi)" stroke-width="2" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="170.0" y1="233.0" x2="170.0" y2="215.0" stroke="var(--hi)" stroke-width="2" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="170.0" y1="255.0" x2="170.0" y2="237.0" stroke="var(--hi)" stroke-width="2" marker-end="url(#ahs)" stroke-linecap="round"/><text x="170.0" y="178.0" text-anchor="middle" fill="var(--hi)" style="font-size:12px;font-weight:600;">J<tspan baseline-shift="sub" style="font-size:9px">s</tspan> (up)</text><line x1="122.0" y1="212.0" x2="122.0" y2="236.0" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round"/><text x="122.0" y="252.0" text-anchor="middle" fill="var(--accent)" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">E</text><line x1="148.0" y1="266.0" x2="90.0" y2="266.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ahs)" stroke-linecap="round"/><line x1="218.0" y1="212.0" x2="218.0" y2="236.0" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#ah)" stroke-linecap="round"/><text x="218.0" y="252.0" text-anchor="middle" fill="var(--accent)" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">E</text><line x1="192.0" y1="266.0" x2="250.0" y2="266.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ahs)" stroke-linecap="round"/><text x="170.0" y="280.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">waves leave both ways</text><rect x="24.0" y="302.0" width="712.0" height="190.0" rx="8" fill="var(--accent2)" fill-opacity="0.07" stroke="none"/><circle cx="58.0" cy="336.0" r="20.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><text x="58.0" y="344.0" text-anchor="middle" fill="white" style="font-size:22px;font-weight:700;">2</text><text x="92.0" y="338.0" text-anchor="start" fill="var(--accent2)" style="font-size:21px;font-weight:700;">It travels at c</text><text x="92.0" y="358.0" text-anchor="start" fill="var(--muted)" style="font-size:13px;">nothing in free space slows it or reshapes it</text><text x="300.0" y="386.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">The field at distance z is a delayed copy of what the</text><text x="300.0" y="406.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">source did:  E(z, t) = f(t − z/c).  The delay is z/c,</text><text x="300.0" y="426.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">with  c = 1/√(μ<tspan baseline-shift="sub" style="font-size:9px">0</tspan>ε<tspan baseline-shift="sub" style="font-size:9px">0</tspan>) = 3×10⁸ m/s — 300 m every</text><text x="300.0" y="446.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">microsecond, 30 cm every nanosecond. The pulse keeps</text><text x="300.0" y="466.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">its shape; only its clock runs late by z/c.</text><text x="300.0" y="484.0" text-anchor="start" fill="var(--hi)" style="font-size:13px;font-weight:600;">the minus sign in (t − z/c) is what says 'toward +z'</text><line x1="96.0" y1="448.0" x2="270.0" y2="448.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#ah)" stroke-linecap="round"/><text x="276.0" y="452.0" text-anchor="start" fill="currentColor" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">z</text><line x1="96.0" y1="445.0" x2="96.0" y2="451.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="96.0" y="463.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">0 m</text><line x1="206.7" y1="445.0" x2="206.7" y2="451.0" stroke="currentColor" stroke-width="1.0" stroke-linecap="round"/><text x="206.7" y="463.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">300 m</text><path d="M96.0,440.0 L98.2,435.5 L100.1,430.3 L107.1,405.5 L108.9,401.4 L110.0,400.2 L110.8,400.0 L111.5,400.2 L112.6,401.4 L114.4,405.5 L121.1,429.1 L124.0,437.2 L127.4,442.5 L129.6,444.3 L131.8,445.3 L135.1,445.8 L140.6,446.0 L262.0,446.0" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="110.8" y="392.0" text-anchor="middle" fill="var(--accent)" style="font-size:12px;font-weight:600;">t = 0</text><path d="M96.0,446.0 L192.3,446.0 L197.8,445.8 L201.1,445.0 L203.0,444.1 L204.8,442.5 L208.1,437.2 L211.1,429.1 L217.7,405.5 L219.6,401.4 L220.7,400.2 L221.4,400.0 L222.9,400.9 L224.7,404.5 L232.9,432.5 L235.1,438.0 L237.7,442.1 L240.2,444.3 L243.9,445.6 L248.7,446.0 L262.0,446.0" fill="none" stroke="var(--accent2)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="221.4" y="392.0" text-anchor="middle" fill="var(--accent2)" style="font-size:12px;font-weight:600;">t = 1 μs</text><line x1="131.0" y1="420.0" x2="201.1" y2="420.0" stroke="var(--hi)" stroke-width="1.6" marker-end="url(#ahs)" stroke-linecap="round"/><text x="166.1" y="414.0" text-anchor="middle" fill="var(--hi)" style="font-size:11.5px;">c·Δt = 300 m</text><rect x="24.0" y="506.0" width="712.0" height="190.0" rx="8" fill="var(--accent2)" fill-opacity="0.07" stroke="none"/><circle cx="58.0" cy="540.0" r="20.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><text x="58.0" y="548.0" text-anchor="middle" fill="white" style="font-size:22px;font-weight:700;">3</text><text x="92.0" y="542.0" text-anchor="start" fill="var(--accent2)" style="font-size:21px;font-weight:700;">It carries power</text><text x="92.0" y="562.0" text-anchor="start" fill="var(--muted)" style="font-size:13px;">the Poynting vector S = E × H, in W/m²</text><text x="300.0" y="590.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">Averaged over a cycle, a sinusoidal wave delivers</text><text x="300.0" y="610.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">⟨S⟩ = E<tspan baseline-shift="sub" style="font-size:9px">0</tspan>²/(2η<tspan baseline-shift="sub" style="font-size:9px">0</tspan>) watts through each square metre</text><text x="300.0" y="630.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">facing it, flowing along E × H.  A source radiating P</text><text x="300.0" y="650.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">equally in all directions spreads it over a sphere of</text><text x="300.0" y="670.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">area 4πr², so ⟨S⟩ = P/(4πr²): twice as far, ¼ as much.</text><text x="300.0" y="688.0" text-anchor="start" fill="var(--hi)" style="font-size:13px;font-weight:600;">fields fall as 1/r, power density as 1/r²</text><circle cx="150.0" cy="630.0" r="5.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><circle cx="150.0" cy="630.0" r="18.0" fill="none" stroke="var(--accent2)" stroke-width="1.6" opacity="0.9"/><circle cx="150.0" cy="630.0" r="36.0" fill="none" stroke="var(--accent2)" stroke-width="1.6" opacity="0.6"/><circle cx="150.0" cy="630.0" r="54.0" fill="none" stroke="var(--accent2)" stroke-width="1.6" opacity="0.35"/><line x1="154.0" y1="623.1" x2="181.0" y2="576.3" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#ahs)" opacity="0.7" stroke-linecap="round"/><line x1="156.9" y1="626.0" x2="203.7" y2="599.0" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#ahs)" opacity="0.7" stroke-linecap="round"/><line x1="158.0" y1="630.0" x2="212.0" y2="630.0" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#ahs)" opacity="0.7" stroke-linecap="round"/><line x1="156.9" y1="634.0" x2="203.7" y2="661.0" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#ahs)" opacity="0.7" stroke-linecap="round"/><line x1="154.0" y1="636.9" x2="181.0" y2="683.7" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#ahs)" opacity="0.7" stroke-linecap="round"/><text x="222.0" y="608.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">isotropic:</text><text x="222.0" y="624.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">r → 2r</text><text x="222.0" y="640.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">⟨S⟩ → ⟨S⟩/4</text><text x="222.0" y="656.0" text-anchor="start" fill="var(--muted)" style="font-size:12px;">P over 4πr²</text><rect x="24.0" y="710.0" width="712.0" height="190.0" rx="8" fill="var(--accent2)" fill-opacity="0.07" stroke="none"/><circle cx="58.0" cy="744.0" r="20.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><text x="58.0" y="752.0" text-anchor="middle" fill="white" style="font-size:22px;font-weight:700;">4</text><text x="92.0" y="746.0" text-anchor="start" fill="var(--accent2)" style="font-size:21px;font-weight:700;">A receiver reads it</text><text x="92.0" y="766.0" text-anchor="start" fill="var(--muted)" style="font-size:13px;">what an antenna at z sees: E, and H for free</text><text x="300.0" y="794.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">Whatever E arrives, H arrives with it, perpendicular</text><text x="300.0" y="814.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">and in phase: |H| = |E|/η<tspan baseline-shift="sub" style="font-size:9px">0</tspan>, with η<tspan baseline-shift="sub" style="font-size:9px">0</tspan> = √(μ<tspan baseline-shift="sub" style="font-size:9px">0</tspan>/ε<tspan baseline-shift="sub" style="font-size:9px">0</tspan>) = 377 Ω</text><text x="300.0" y="834.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">fixed by vacuum. Which way did it come from? Read the</text><text x="300.0" y="854.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">argument, not the amplitude: cos(ωt − βz) is heading</text><text x="300.0" y="874.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">to +z, cos(ωt + βz) to −z.</text><text x="300.0" y="892.0" text-anchor="start" fill="var(--hi)" style="font-size:13px;font-weight:600;">E × H always points the way the wave travels</text><line x1="242.0" y1="790.0" x2="242.0" y2="866.0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="242.0" y1="866.0" x2="228.0" y2="880.0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="242.0" y1="866.0" x2="256.0" y2="880.0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><text x="242.0" y="894.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">receiver</text><line x1="130.0" y1="846.0" x2="130.0" y2="802.0" stroke="var(--accent)" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/><text x="120.0" y="800.0" text-anchor="end" fill="var(--accent)" style="font-size:13px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;">E</text><circle cx="160.0" cy="824.0" r="7.0" fill="none" stroke="var(--accent2)" stroke-width="1.4"/><circle cx="160.0" cy="824.0" r="1.8" fill="var(--accent2)" stroke="none" stroke-width="1.5"/><text x="172.0" y="820.0" text-anchor="start" fill="var(--accent2)" style="font-size:12px;font-weight:600;">H (out)</text><line x1="106.0" y1="868.0" x2="194.0" y2="868.0" stroke="var(--hi)" stroke-width="2.0" marker-end="url(#ahs)" stroke-linecap="round"/><text x="92.0" y="826.0" text-anchor="end" fill="var(--muted)" style="font-size:11px;">wave</text><text x="100.0" y="886.0" text-anchor="start" fill="var(--hi)" style="font-size:11.5px;">up × out = right</text><text x="100.0" y="900.0" text-anchor="start" fill="var(--hi)" style="font-size:11.5px;">E × H → +z ✓</text><rect x="24.0" y="914.0" width="712.0" height="200.0" rx="8" fill="var(--hi)" fill-opacity="0.08" stroke="none"/><rect x="24.0" y="914.0" width="5" height="200.0" rx="2" fill="var(--hi)"/><text x="42.0" y="944.0" text-anchor="start" fill="var(--hi)" style="font-size:20px;font-weight:700;">The story in numbers</text><text x="42.0" y="966.0" text-anchor="start" fill="currentColor" style="font-size:14px;font-family:'STIX Two Math','Latin Modern Math','Cambria Math','Times New Roman',serif;font-style:italic;">a 50 kW transmitter radiating equally in all directions; you stand 10 km away</text><line x1="60.0" y1="1018.0" x2="270.0" y2="1018.0" stroke="var(--hi)" stroke-width="2.0" marker-end="url(#ah)" stroke-linecap="round"/><circle cx="60.0" cy="1018.0" r="6.0" fill="var(--hi)" stroke="none" stroke-width="1.5"/><line x1="60.0" y1="1012.0" x2="60.0" y2="988.0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><text x="60.0" y="1038.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">t = 0</text><text x="52.0" y="1052.0" text-anchor="start" fill="var(--muted)" style="font-size:11.5px;">50 kW leaves</text><circle cx="266.0" cy="996.0" r="4.0" fill="currentColor" stroke="none" stroke-width="1.5"/><line x1="266.0" y1="1000.0" x2="266.0" y2="1014.0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><text x="266.0" y="1038.0" text-anchor="middle" fill="currentColor" style="font-size:12px;font-weight:600;">t = 33.3 μs</text><text x="260.0" y="1052.0" text-anchor="middle" fill="var(--muted)" style="font-size:11.5px;">it reaches you</text><text x="165.0" y="1008.0" text-anchor="middle" fill="var(--hi)" style="font-size:12px;">10 km at 300 m/μs</text><text x="42.0" y="1072.0" text-anchor="start" fill="var(--muted)" style="font-size:12.5px;">a tenth of a volt per metre, half a milliamp</text><text x="42.0" y="1088.0" text-anchor="start" fill="var(--muted)" style="font-size:12.5px;">per metre, 40 μW on each square metre —</text><text x="42.0" y="1104.0" text-anchor="start" fill="var(--muted)" style="font-size:12.5px;">and a receiver hears it easily.</text><text x="378.0" y="1000.0" text-anchor="end" fill="var(--hi)" style="font-size:13.5px;font-weight:700;">delay</text><text x="390.0" y="1000.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">r/c = 10⁴ m / (3×10⁸ m/s) = 33.3 μs</text><text x="378.0" y="1025.0" text-anchor="end" fill="var(--hi)" style="font-size:13.5px;font-weight:700;">sphere</text><text x="390.0" y="1025.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">4πr² = 4π(10⁴)² = 1.26×10⁹ m²  (1257 km²)</text><text x="378.0" y="1050.0" text-anchor="end" fill="var(--hi)" style="font-size:13.5px;font-weight:700;">⟨S⟩</text><text x="390.0" y="1050.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">P/(4πr²) = 5×10⁴ / 1.26×10⁹ = 39.8 μW/m²</text><text x="378.0" y="1075.0" text-anchor="end" fill="var(--hi)" style="font-size:13.5px;font-weight:700;">E<tspan baseline-shift="sub" style="font-size:9px">0</tspan></text><text x="390.0" y="1075.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">√(2η<tspan baseline-shift="sub" style="font-size:9px">0</tspan>⟨S⟩) = √(2·377·39.8×10⁻⁶) = 0.173 V/m</text><text x="378.0" y="1100.0" text-anchor="end" fill="var(--hi)" style="font-size:13.5px;font-weight:700;">H<tspan baseline-shift="sub" style="font-size:9px">0</tspan></text><text x="390.0" y="1100.0" text-anchor="start" fill="currentColor" style="font-size:13.5px;">E<tspan baseline-shift="sub" style="font-size:9px">0</tspan>/η<tspan baseline-shift="sub" style="font-size:9px">0</tspan> = 0.173/377 = 0.459 mA/m</text><text x="24.0" y="1140.0" text-anchor="start" fill="var(--accent2)" style="font-size:18px;font-weight:700;">Common mistakes</text><rect x="24.0" y="1152.0" width="232.0" height="104.0" rx="8" fill="var(--accent2)" fill-opacity="0.09" stroke="none"/><text x="38.0" y="1176.0" text-anchor="start" fill="var(--hi)" style="font-size:14px;font-weight:700;">✗ c vs v</text><text x="38.0" y="1197.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;">c = 3×10⁸ m/s holds in vacuum</text><text x="38.0" y="1214.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;">(and air). In a dielectric</text><text x="38.0" y="1231.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;">v = c/√ε<tspan baseline-shift="sub" style="font-size:9px">r</tspan>: glass, ε<tspan baseline-shift="sub" style="font-size:9px">r</tspan> = 2.25,</text><text x="38.0" y="1248.0" text-anchor="start" fill="currentColor" style="font-size:12.5px;">gives v = c/1.5 and λ = λ<tspan baseline-shift
